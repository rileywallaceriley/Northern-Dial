<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">If You Like Kaytranada: Five Canadian Artists to Hear Next</title>
  <desc id="desc">Northern Dial editorial artwork featuring Jacques Greene, BAMBII, Rochelle Jordan, Planet Giza and KALLITECHNIS.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#343434" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#171717"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="1035" cy="118" r="168" fill="#CC3333" opacity="0.9"/>
  <circle cx="1080" cy="105" r="96" fill="#171717"/>
  <circle cx="1080" cy="105" r="60" fill="none" stroke="#fff" stroke-width="3" opacity="0.9"/>
  <circle cx="1080" cy="105" r="12" fill="#CC3333"/>
  <rect x="34" y="34" width="1132" height="607" rx="8" fill="none" stroke="#CC3333" stroke-width="6"/>
  <rect x="72" y="68" width="210" height="38" rx="4" fill="#CC3333"/>
  <text x="92" y="95" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="3">NORTHERN DIAL</text>
  <text x="74" y="180" fill="#CC3333" font-family="Arial Narrow, Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="5">IF YOU LIKE</text>
  <text x="68" y="318" fill="#fff" font-family="Impact, Haettenschweiler, Arial Narrow Bold, sans-serif" font-size="132" letter-spacing="3" filter="url(#shadow)">KAYTRANADA</text>
  <rect x="72" y="350" width="930" height="5" fill="#CC3333"/>
  <text x="74" y="407" fill="#f2f2f2" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="2">5 CANADIAN ARTISTS TO HEAR NEXT</text>
  <g fill="#fff" font-family="Arial Narrow, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="1.5">
    <text x="74" y="486">JACQUES GREENE</text>
    <text x="388" y="486">BAMBII</text>
    <text x="602" y="486">ROCHELLE JORDAN</text>
    <text x="74" y="552">PLANET GIZA</text>
    <text x="388" y="552">KALLITECHNIS</text>
  </g>
  <g fill="#CC3333">
    <circle cx="56" cy="478" r="5"/><circle cx="370" cy="478" r="5"/><circle cx="584" cy="478" r="5"/>
    <circle cx="56" cy="544" r="5"/><circle cx="370" cy="544" r="5"/>
  </g>
  <text x="74" y="608" fill="#aaa" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2">DISCOVERY • CANADA • HOUSE • R&amp;B • HIP-HOP • CLUB</text>
</svg>