<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Northern Dial After Dark — Toronto and Brampton</title>
  <desc id="desc">A red, black and cream editorial collage featuring K. Forest, Enola Bédard, AHSIA, Derin Falana and Haley Smalls.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090909"/><stop offset="1" stop-color="#2b0d12"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".08"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#night)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <path d="M0 620L300 470 560 620 830 420 1200 575V800H0Z" fill="#111" opacity=".9"/>
  <path d="M0 610L300 460 560 610 830 410 1200 565" fill="none" stroke="#d33" stroke-width="5" opacity=".85"/>
  <g filter="url(#shadow)">
    <rect x="58" y="72" width="280" height="470" fill="#b52f38" transform="rotate(-4 58 72)"/>
    <rect x="285" y="112" width="280" height="470" fill="#ded2b6" transform="rotate(3 285 112)"/>
    <rect x="525" y="70" width="280" height="470" fill="#7f2029" transform="rotate(-2 525 70)"/>
    <rect x="770" y="112" width="280" height="470" fill="#c7b99f" transform="rotate(4 770 112)"/>
    <rect x="980" y="72" width="170" height="470" fill="#a52c36" transform="rotate(-5 980 72)"/>
  </g>
  <g fill="#171717" opacity=".82">
    <circle cx="198" cy="265" r="108"/><circle cx="425" cy="300" r="108"/><circle cx="665" cy="260" r="108"/><circle cx="910" cy="300" r="108"/><circle cx="1065" cy="260" r="86"/>
  </g>
  <g fill="#f3ead8" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="2">
    <text x="76" y="604" font-size="22">K. FOREST</text><text x="313" y="636" font-size="22">ENOLA BÉDARD</text><text x="560" y="604" font-size="22">AHSIA</text><text x="790" y="636" font-size="22">DERIN FALANA</text><text x="1000" y="604" font-size="18">HALEY</text><text x="1000" y="628" font-size="18">SMALLS</text>
  </g>
  <rect x="54" y="680" width="1092" height="2" fill="#d33"/>
  <text x="58" y="730" fill="#f3ead8" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="7">NORTHERN DIAL AFTER DARK</text>
  <text x="60" y="770" fill="#d33" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4">TORONTO · BRAMPTON · CANADIAN MUSIC</text>
</svg>
