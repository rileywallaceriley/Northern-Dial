<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cottage Lake</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'Helvetica Neue',sans-serif}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%}
  #scene{z-index:1}#water{z-index:2}#particles{z-index:3}
  .clock{position:fixed;top:32px;right:36px;z-index:100;text-align:right;user-select:none;
    background:rgba(0,0,0,0.3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    padding:14px 22px;border-radius:14px;border:1px solid rgba(255,255,255,0.08)}
  .clock .time{font-size:clamp(26px,3.5vw,48px);font-weight:200;letter-spacing:3px;
    color:rgba(255,255,255,0.92);text-shadow:0 2px 20px rgba(0,0,0,0.6)}
  .clock .date{font-size:clamp(10px,1.2vw,14px);font-weight:300;letter-spacing:2.5px;
    text-transform:uppercase;color:rgba(255,255,255,0.5);margin-top:4px;text-shadow:0 1px 10px rgba(0,0,0,0.6)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<canvas id="water"></canvas>
<canvas id="particles"></canvas>
<div class="clock"><div class="time" id="timeDisplay"></div><div class="date" id="dateDisplay"></div></div>
<script>
const scene=document.getElementById('scene');
const water=document.getElementById('water');
const particles=document.getElementById('particles');
const sCtx=scene.getContext('2d');
const wCtx=water.getContext('2d');
const pCtx=particles.getContext('2d');

function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  [scene,water,particles].forEach(c=>{c.width=w;c.height=h});
  drawScene();
}
window.addEventListener('resize',resize);resize();

function tod(){
  const hr=new Date().getHours()+new Date().getMinutes()/60;
  if(hr>=5&&hr<21)return Math.abs(hr-14)/9*0.3;
  const nh=hr>=21?hr-21:hr+3;
  return 0.3+Math.min(nh/6,1)*0.7;
}

function drawScene(){
  const ctx=sCtx,w=scene.width,h=scene.height;
  ctx.clearRect(0,0,w,h);
  const n=tod();
  const b=1-n*0.75;
  const WL=h*0.45;

  // ── SKY ──
  const skyTop=n<0.5?[100,170,240]:[8,8,35];
  const skyBot=n<0.5?[150,200,245]:[15,15,45];
  const sg=ctx.createLinearGradient(0,0,0,h*0.6);
  sg.addColorStop(0,`rgb(${skyTop})`);sg.addColorStop(1,`rgb(${skyBot})`);
  ctx.fillStyle=sg;ctx.fillRect(0,0,w,h);

  // Clouds
  if(n<0.5){
    const ca=1-n*2;
    ctx.fillStyle=`rgba(255,255,255,${ca*0.8})`;
    [{x:0.15,y:0.08,s:1.2},{x:0.4,y:0.05,s:1.5},{x:0.6,y:0.12,s:1.0},
     {x:0.75,y:0.07,s:1.3},{x:0.25,y:0.15,s:0.8},{x:0.55,y:0.18,s:0.9},{x:0.85,y:0.14,s:0.7}].forEach(cl=>{
      const cx=cl.x*w+Math.sin(performance.now()*0.0001+cl.x*10)*20,cy=cl.y*h,s=cl.s*25;
      ctx.fillRect(cx-s,cy-s*0.3,s*3,s*0.6);
      ctx.fillRect(cx-s*0.5,cy-s*0.6,s*2,s*0.4);
      ctx.fillRect(cx,cy-s*0.8,s*1.5,s*0.4);
    });
  }

  // Sun/Moon
  const sunCX=w*(0.15+n*0.3);
  if(n<0.5){
    ctx.fillStyle='rgba(255,240,150,0.9)';ctx.beginPath();ctx.arc(sunCX,h*0.08+n*h*0.15,25,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle='rgba(220,225,255,0.9)';ctx.beginPath();ctx.arc(sunCX,h*0.05+(n-0.5)*h*0.1,15,0,Math.PI*2);ctx.fill();
  }

  // ── WATER ──
  const wT=n<0.5?[30,100,200]:[5,15,40],wB=n<0.5?[20,60,140]:[3,10,25];
  const wg=ctx.createLinearGradient(0,WL,0,h);
  wg.addColorStop(0,`rgb(${wT})`);wg.addColorStop(1,`rgb(${wB})`);
  ctx.fillStyle=wg;ctx.fillRect(0,WL,w,h-WL);

  // Sparkles
  if(n<0.5){
    const sa=(0.5-n)*1.5;
    ctx.fillStyle=`rgba(255,255,255,${sa*0.4})`;
    for(let i=0;i<40;i++){
      ctx.fillRect((i*37+performance.now()*0.02)%w,WL+20+((i*53)%((h-WL)-40)),2,1);
    }
  }

  // ── FAR SHORE ──
  const fY=WL-15;
  ctx.fillStyle=n<0.5?`rgb(${Math.round(20*b+5)},${Math.round(50*b+10)},${Math.round(20*b+5)})`:`rgb(${Math.round(8*b+2)},${Math.round(20*b+4)},${Math.round(8*b+2)})`;
  ctx.beginPath();ctx.moveTo(0,fY);
  for(let x=0;x<=w*0.55;x+=4)ctx.lineTo(x,fY-Math.sin(x*0.005)*8-Math.sin(x*0.015)*3);
  ctx.lineTo(w*0.55,WL);ctx.lineTo(0,WL);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(w*0.35,fY+5);
  for(let x=w*0.35;x<=w*0.6;x+=4)ctx.lineTo(x,fY+5-Math.sin(x*0.005)*6);
  ctx.lineTo(w*0.6,WL);ctx.lineTo(w*0.35,WL);ctx.closePath();ctx.fill();

  for(let i=0;i<25;i++){
    const tx=(i/25)*w*0.55+Math.sin(i*3.7)*6;
    const ty=fY-Math.sin(tx*0.005)*8-Math.sin(tx*0.015)*3;
    const th=10+Math.sin(i*2.3)*4;
    ctx.fillStyle=n<0.5?`rgb(${Math.round(15*b+4)},${Math.round(45*b+8)},${Math.round(15*b+4)})`:`rgb(${Math.round(6*b+2)},${Math.round(18*b+3)},${Math.round(6*b+2)})`;
    ctx.beginPath();ctx.moveTo(tx-4,ty);ctx.lineTo(tx,ty-th);ctx.lineTo(tx+4,ty);ctx.closePath();ctx.fill();
  }

  // ── ISLAND (3 pines) ──
  const iX=w*0.22,iY=WL-5;
  ctx.fillStyle=`rgb(${Math.round(80*b+20)},${Math.round(75*b+18)},${Math.round(60*b+15)})`;
  ctx.beginPath();ctx.ellipse(iX,iY,40,10,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=`rgb(${Math.round(30*b+8)},${Math.round(60*b+12)},${Math.round(20*b+5)})`;
  ctx.beginPath();ctx.ellipse(iX,iY-3,35,8,0,0,Math.PI*2);ctx.fill();
  [{x:-15,h:35},{x:0,h:45},{x:14,h:38}].forEach(t=>{
    const tx=iX+t.x,ty=iY-3,th=t.h;
    ctx.fillStyle=n<0.5?`rgb(${Math.round(10*b+3)},${Math.round(55*b+10)},${Math.round(10*b+3)})`:`rgb(${Math.round(5*b+2)},${Math.round(35*b+6)},${Math.round(5*b+2)})`;
    ctx.fillRect(tx-2,ty-th*0.2,4,th*0.2);
    for(let l=0;l<4;l++){const ly=ty-th*0.2-l*th*0.22,lw=10-l*2;
    ctx.beginPath();ctx.moveTo(tx-lw,ly);ctx.lineTo(tx,ly-th*0.28);ctx.lineTo(tx+lw,ly);ctx.closePath();ctx.fill();}
  });

  // ── RIGHT SHORE ──
  const sX=w*0.65;
  ctx.beginPath();ctx.moveTo(w,0);ctx.lineTo(sX,0);
  for(let i=0;i<=20;i++){const t=i/20;ctx.lineTo(sX-10+t*15+Math.sin(t*Math.PI)*5,t*(WL+8));}
  ctx.lineTo(w,WL+8);ctx.closePath();
  ctx.fillStyle=`rgb(${Math.round(40*b+10)},${Math.round(50*b+12)},${Math.round(25*b+6)})`;ctx.fill();

  // ── CABIN ──
  const cX=sX+w*0.12,cY=WL-60,cW=70,cH=50;
  ctx.fillStyle=`rgb(${Math.round(80*b+20)},${Math.round(50*b+12)},${Math.round(25*b+6)})`;
  ctx.fillRect(cX,cY-cH,cW,cH);
  ctx.fillStyle=`rgb(${Math.round(140*b+30)},${Math.round(40*b+10)},${Math.round(25*b+6)})`;
  ctx.beginPath();ctx.moveTo(cX-8,cY-cH);ctx.lineTo(cX+cW/2,cY-cH-30);ctx.lineTo(cX+cW+8,cY-cH);ctx.closePath();ctx.fill();
  ctx.fillStyle=`rgb(${Math.round(90*b+20)},${Math.round(60*b+15)},${Math.round(40*b+10)})`;
  ctx.fillRect(cX+cW*0.7,cY-cH-40,12,25);
  if(b>0.3){ctx.fillStyle=`rgba(200,200,200,${b*0.3})`;const st=performance.now()*0.001;
    for(let i=0;i<5;i++){const sy=cY-cH-45-i*12,sx=cX+cW*0.7+6+Math.sin(st+i*0.8)*8;
    ctx.beginPath();ctx.arc(sx,sy,4+i*2,0,Math.PI*2);ctx.fill();}}
  ctx.fillStyle=n>0.5?`rgba(255,200,80,${(n-0.5)*2})`:`rgba(150,200,255,0.4)`;
  ctx.fillRect(cX+8,cY-cH+12,14,12);ctx.fillRect(cX+cW-22,cY-cH+12,14,12);
  ctx.fillStyle=`rgb(${Math.round(60*b+15)},${Math.round(35*b+8)},${Math.round(18*b+4)})`;
  ctx.fillRect(cX+cW/2-7,cY-22,14,22);
  ctx.fillStyle=`rgb(${Math.round(100*b+25)},${Math.round(70*b+18)},${Math.round(40*b+10)})`;
  ctx.fillRect(cX-5,cY-2,cW+10,5);

  // Trees on right shore
  [{x:sX+w*0.02,h:50},{x:sX+w*0.06,h:60},{x:sX+w*0.10,h:45},{x:sX+w*0.20,h:55},{x:sX+w*0.25,h:40},{x:sX+w*0.30,h:50}].forEach((t,i)=>{
    const tx=t.x,ty=WL*0.3+i*5,th=t.h;
    ctx.fillStyle=n<0.5?`rgb(${Math.round(10*b+3)},${Math.round(55*b+10)},${Math.round(10*b+3)})`:`rgb(${Math.round(5*b+2)},${Math.round(35*b+6)},${Math.round(5*b+2)})`;
    ctx.fillRect(tx-2,ty-th*0.2,4,th*0.2);
    for(let l=0;l<5;l++){const ly=ty-th*0.2-l*th*0.2,lw=8-l*1.2;
    ctx.beginPath();ctx.moveTo(tx-lw,ly);ctx.lineTo(tx,ly-th*0.25);ctx.lineTo(tx+lw,ly);ctx.closePath();ctx.fill();}
  });
  [{x:sX+w*0.28,h:45},{x:sX+w*0.33,h:50},{x:sX+w*0.38,h:40}].forEach((t,i)=>{
    const tx=t.x,ty=WL*0.25+i*3,th=t.h;
    ctx.fillStyle=`rgb(${Math.round(180*b+25)},${Math.round(80*b+15)},${Math.round(15*b+4)})`;
    ctx.beginPath();ctx.arc(tx,ty-th*0.5,th*0.4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgb(${Math.round(50*b+10)},${Math.round(35*b+8)},${Math.round(20*b+5)})`;
    ctx.fillRect(tx-2,ty-th*0.2,4,th*0.2);
  });

  // Canoe
  ctx.fillStyle=`rgb(${Math.round(180*b+30)},${Math.round(40*b+8)},${Math.round(20*b+5)})`;
  ctx.beginPath();ctx.ellipse(sX+w*0.05,WL-2,25,5,0.1,0,Math.PI*2);ctx.fill();

  // ── CANADIAN FLAG (left side, at end of dock) ──
  ctx.fillStyle=`rgb(${Math.round(180*b+30)},${Math.round(180*b+30)},${Math.round(180*b+30)})`;
  ctx.fillRect(23,h*0.15,4,h*0.35);
  ctx.fillStyle=`rgba(255,255,255,${0.8+b*0.2})`;ctx.fillRect(27,h*0.15,50,30);
  ctx.fillStyle=`rgba(200,30,30,${0.8+b*0.2})`;ctx.fillRect(27,h*0.15,12.5,30);ctx.fillRect(64.5,h*0.15,12.5,30);
  ctx.fillStyle=`rgba(200,30,30,${0.9+b*0.1})`;
  ctx.beginPath();
  ctx.moveTo(52,h*0.15+7);ctx.lineTo(50,h*0.15+12);ctx.lineTo(45,h*0.15+10);
  ctx.lineTo(49,h*0.15+15);ctx.lineTo(45,h*0.15+19);ctx.lineTo(51,h*0.15+17);
  ctx.lineTo(52,h*0.15+23);ctx.lineTo(53,h*0.15+17);ctx.lineTo(59,h*0.15+19);
  ctx.lineTo(55,h*0.15+15);ctx.lineTo(59,h*0.15+10);ctx.lineTo(54,h*0.15+12);
  ctx.closePath();ctx.fill();

  // ── DOCK (bottom-left corner → diagonally up-right into lake) ──
  const dSX=0,dSY=h-30,dEX=w*0.35,dEY=WL+15,dW=50;
  const dA=Math.atan2(dEY-dSY,dEX-dSX),dL=Math.sqrt((dEX-dSX)**2+(dEY-dSY)**2);
  const pX=-Math.sin(dA),pY=Math.cos(dA);

  ctx.fillStyle=`rgba(0,0,0,${0.15+n*0.1})`;
  ctx.save();ctx.translate(dSX,dSY);ctx.rotate(dA);ctx.fillRect(0,dW/2+2,dL,5);ctx.restore();

  ctx.fillStyle=`rgb(${Math.round(160*b+30)},${Math.round(120*b+22)},${Math.round(60*b+12)})`;
  ctx.save();ctx.translate(dSX,dSY);ctx.rotate(dA);ctx.fillRect(0,-dW/2,dL,dW);
  const pn=Math.floor(dL/8);
  for(let i=0;i<pn;i++){const px=dL*(i/pn);ctx.strokeStyle=`rgba(0,0,0,${0.2*b})`;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(px,-dW/2);ctx.lineTo(px,dW/2);ctx.stroke();}
  ctx.restore();

  ctx.fillStyle=`rgb(${Math.round(50*b+12)},${Math.round(40*b+10)},${Math.round(25*b+6)})`;
  for(let i=0;i<=8;i++){const t=i/8,px=dSX+(dEX-dSX)*t,py=dSY+(dEY-dSY)*t;
  ctx.save();ctx.translate(px,py);ctx.rotate(dA);ctx.fillRect(-2,dW/2-2,4,12);ctx.restore();}

  // ── MUSKOKA CHAIRS ──
  const c1T=0.55,c1X=dSX+(dEX-dSX)*c1T+pX*dW*0.15,c1Y=dSY+(dEY-dSY)*c1T+pY*dW*0.15;
  drawChair(ctx,c1X,c1Y-5,0.7,b,'#CC2222',dA);
  const c2T=0.40,c2X=dSX+(dEX-dSX)*c2T-pX*dW*0.15,c2Y=dSY+(dEY-dSY)*c2T-pY*dW*0.15;
  drawChair(ctx,c2X,c2Y-3,0.65,b,'#556677',dA);

  // Table + mug
  const tT=(c1T+c2T)/2,tX=dSX+(dEX-dSX)*tT,tY=dSY+(dEY-dSY)*tT;
  ctx.fillStyle=`rgb(${Math.round(100*b+25)},${Math.round(70*b+18)},${Math.round(40*b+10)})`;
  ctx.save();ctx.translate(tX,tY-3);ctx.rotate(dA);ctx.beginPath();ctx.ellipse(0,0,5,2,0,0,Math.PI*2);ctx.fill();ctx.fillRect(-1,0,2,5);ctx.restore();
  ctx.fillStyle=`rgb(${Math.round(200*b+30)},${Math.round(200*b+30)},${Math.round(190*b+28)})`;
  ctx.save();ctx.translate(tX,tY-7);ctx.rotate(dA);ctx.fillRect(-2,-3,4,3);ctx.restore();

  // ── RED UMBRELLA (closed) on shore ──
  const ux=sX+w*0.08,uy=WL-5;
  ctx.fillStyle=`rgb(${Math.round(50*b+12)},${Math.round(40*b+10)},${Math.round(25*b+6)})`;
  ctx.fillRect(ux-1.5,uy-50,3,50);
  ctx.beginPath();ctx.moveTo(ux,uy-50);ctx.quadraticCurveTo(ux-20,uy-55,ux-25,uy-35);
  ctx.strokeStyle=`rgb(${Math.round(50*b+12)},${Math.round(40*b+10)},${Math.round(25*b+6)})`;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=`rgb(${Math.round(180*b+25)},${Math.round(40*b+8)},${Math.round(30*b+6)})`;
  ctx.beginPath();ctx.moveTo(ux-25,uy-35);ctx.lineTo(ux-29,uy-30);ctx.lineTo(ux-21,uy-30);ctx.closePath();ctx.fill();

  // ── FLOWER POT on dock ──
  const potT=0.70,potX=dSX+(dEX-dSX)*potT+pX*dW*0.2,potY=dSY+(dEY-dSY)*potT+pY*dW*0.2;
  ctx.save();ctx.translate(potX,potY-3);ctx.rotate(dA);
  ctx.fillStyle=`rgb(${Math.round(140*b+30)},${Math.round(80*b+18)},${Math.round(40*b+10)})`;
  ctx.fillRect(-6,-8,12,8);ctx.fillRect(-8,-10,16,3);
  for(let i=0;i<6;i++){ctx.fillStyle=`rgb(${Math.round(200*b+30)},${Math.round(50*b+10)},${Math.round(30*b+6)})`;
  ctx.beginPath();ctx.arc(-5+i*2,-12-Math.sin(i*1.5)*3,3,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}

function drawChair(ctx,x,y,sc,b,col,a){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(sc,sc);
  const r=parseInt(col.slice(1,3),16),g=parseInt(col.slice(3,5),16),bl=parseInt(col.slice(5,7),16);
  ctx.fillStyle=`rgb(${Math.round(r*b)},${Math.round(g*b)},${Math.round(bl*b)})`;
  for(let i=0;i<6;i++)ctx.fillRect(-12+i*4.5,-38,3.5,34);
  ctx.fillRect(-15,-40,30,3);ctx.fillRect(-17,-4,34,4);
  ctx.fillRect(-15,-4,3,22);ctx.fillRect(15,-4,3,22);
  ctx.fillRect(-12,-4,2.5,20);ctx.fillRect(12,-4,2.5,20);
  ctx.fillRect(-17,-20,3,17);ctx.fillRect(18,-20,3,17);ctx.fillRect(-17,-20,36,2.5);
  ctx.restore();
}

function drawWater(t){
  const ctx=wCtx,w=water.width,h=water.height;ctx.clearRect(0,0,w,h);
  const n=tod();if(n>=0.5){const ws=h*0.45,a=(n-0.5)*2,rx=w*(0.15+n*0.3);
  for(let y=ws;y<ws+80;y+=2){const p=(y-ws)/80,sh=Math.sin(y*0.06+t*0.0015)*0.5+0.5,ww=15+Math.sin(t*0.0006+y*0.03)*6;
  ctx.beginPath();ctx.moveTo(rx-ww*(1-p),y);ctx.lineTo(rx+ww*(1-p),y);
  ctx.strokeStyle=`rgba(200,210,255,${sh*0.1*(1-p)})`;ctx.lineWidth=1;ctx.stroke();}}
}

const ff=[];for(let i=0;i<25;i++)ff.push({x:0.1+Math.random()*0.5,y:0.2+Math.random()*0.35,vx:(Math.random()-0.5)*0.0004,vy:(Math.random()-0.5)*0.0003,s:Math.random()*2+1,ph:Math.random()*Math.PI*2,sp:Math.random()*0.002+0.001});
function drawParticles(t){
  const ctx=pCtx,w=particles.width,h=particles.height;ctx.clearRect(0,0,w,h);
  const n=tod();if(n<0.5)return;const a=(n-0.5)*2;
  ff.forEach(f=>{f.x+=f.vx+Math.sin(t*f.sp+f.ph)*0.0003;f.y+=f.vy+Math.cos(t*f.sp*0.7+f.ph)*0.0002;
  if(f.x<0.05)f.x=0.55;if(f.x>0.55)f.x=0.05;if(f.y<0.15)f.y=0.55;if(f.y>0.55)f.y=0.15;
  const gl=Math.sin(t*f.sp*3+f.ph)*0.5+0.5,al=a*gl*0.7;
  const g=ctx.createRadialGradient(f.x*w,f.y*h,0,f.x*w,f.y*h,f.s*5);
  g.addColorStop(0,`rgba(255,255,150,${al*0.5})`);g.addColorStop(0.3,`rgba(255,220,100,${al*0.15})`);g.addColorStop(1,'rgba(255,220,100,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x*w,f.y*h,f.s*5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=`rgba(255,255,200,${al})`;ctx.beginPath();ctx.arc(f.x*w,f.y*h,f.s,0,Math.PI*2);ctx.fill();});
}

const mo=['January','February','March','April','May','June','July','August','September','October','November','December'];
const da=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function uc(){const now=new Date(),h=now.getHours(),m=now.getMinutes();
document.getElementById('timeDisplay').textContent=`${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`;
document.getElementById('dateDisplay').textContent=`${da[now.getDay()]} · ${mo[now.getMonth()]} ${now.getDate()}`}
setInterval(uc,1000);uc();

let fc=0;function anim(t){fc++;if(fc%2===0){drawScene();drawWater(t)}drawParticles(t);requestAnimationFrame(anim)}
requestAnimationFrame(anim);
</script>
</body>
</html>
