<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cottage Lake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: 'Helvetica Neue', sans-serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  #sky { z-index: 1; }
  #stars { z-index: 2; }
  #scene { z-index: 3; }
  #water { z-index: 4; }
  #particles { z-index: 5; }

  .clock {
    position: fixed;
    top: 32px;
    right: 36px;
    z-index: 100;
    text-align: right;
    user-select: none;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 14px 22px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .clock .time {
    font-size: clamp(26px, 3.5vw, 48px);
    font-weight: 200;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 2px 20px rgba(0,0,0,0.6);
  }
  .clock .date {
    font-size: clamp(10px, 1.2vw, 14px);
    font-weight: 300;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
    text-shadow: 0 1px 10px rgba(0,0,0,0.6);
  }
  .clock .location {
    font-size: clamp(8px, 0.9vw, 11px);
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-top: 6px;
    text-shadow: 0 1px 10px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="stars"></canvas>
<canvas id="scene"></canvas>
<canvas id="water"></canvas>
<canvas id="particles"></canvas>

<div class="clock">
  <div class="time" id="timeDisplay"></div>
  <div class="date" id="dateDisplay"></div>
  <div class="location">🇨 Cottage Lake, Ontario</div>
</div>

<script>
const canvases = {};
const ctxs = {};
['sky', 'stars', 'scene', 'water', 'particles'].forEach(id => {
  canvases[id] = document.getElementById(id);
  ctxs[id] = canvases[id].getContext('2d');
});

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  Object.values(canvases).forEach(c => { c.width = w; c.height = h; });
  drawScene();
}
window.addEventListener('resize', resize);
resize();

// ═══════════════════════════════════════════
// TIME OF DAY
// ═══════════════════════════════════════════
function getTimeOfDay() {
  const now = new Date();
  const hours = now.getHours() + now.getMinutes() / 60;
  if (hours >= 5 && hours < 21) {
    return Math.abs(hours - 14) / 9 * 0.3;
  } else {
    const nightHours = hours >= 21 ? hours - 21 : hours + 3;
    return 0.3 + Math.min(nightHours / 6, 1) * 0.7;
  }
}

function getSkyColors(nightness) {
  const dayTop = [80, 150, 220];
  const dayBot = [170, 210, 240];
  const nightTop = [8, 8, 30];
  const nightBot = [20, 18, 50];
  const dawnTop = [140, 70, 90];
  const dawnBot = [230, 130, 70];
  const duskTop = [100, 50, 70];
  const duskBot = [210, 110, 50];

  let top, bot;
  if (nightness < 0.3) { top = dayTop; bot = dayBot; }
  else if (nightness < 0.5) {
    const t = (nightness - 0.3) / 0.2;
    top = dayTop.map((c, i) => c + (duskTop[i] - c) * t);
    bot = dayBot.map((c, i) => c + (duskBot[i] - c) * t);
  } else if (nightness < 0.6) {
    const t = (nightness - 0.5) / 0.1;
    top = duskTop.map((c, i) => c + (nightTop[i] - c) * t);
    bot = duskBot.map((c, i) => c + (nightBot[i] - c) * t);
  } else if (nightness < 0.7) { top = nightTop; bot = nightBot; }
  else if (nightness < 0.85) {
    const t = (nightness - 0.7) / 0.15;
    top = nightTop.map((c, i) => c + (dawnTop[i] - c) * (1 - t));
    bot = nightBot.map((c, i) => c + (dawnBot[i] - c) * (1 - t));
  } else {
    const t = (nightness - 0.85) / 0.15;
    top = dawnTop.map((c, i) => c + (dayTop[i] - c) * t);
    bot = dawnBot.map((c, i) => c + (dayBot[i] - c) * t);
  }
  return { top: top.map(Math.round), bot: bot.map(Math.round) };
}

function drawSky() {
  const ctx = ctxs.sky;
  const w = ctx.canvas.width;
  const h = ctx.canvas.height;
  const nightness = getTimeOfDay();
  const colors = getSkyColors(nightness);

  const grad = ctx.createLinearGradient(0, 0, 0, h * 0.7);
  grad.addColorStop(0, `rgb(${colors.top[0]},${colors.top[1]},${colors.top[2]})`);
  grad.addColorStop(1, `rgb(${colors.bot[0]},${colors.bot[1]},${colors.bot[2]})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // Sun or Moon
  const celestialX = w * (0.35 + Math.sin(nightness * Math.PI) * 0.35);
  if (nightness < 0.5) {
    const sunY = h * 0.12 + nightness * h * 0.25;
    const sg = ctx.createRadialGradient(celestialX, sunY, 0, celestialX, sunY, 100);
    sg.addColorStop(0, 'rgba(255,245,190,1)');
    sg.addColorStop(0.15, 'rgba(255,230,120,0.9)');
    sg.addColorStop(0.4, 'rgba(255,200,80,0.15)');
    sg.addColorStop(1, 'rgba(255,200,80,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(celestialX, sunY, 100, 0, Math.PI * 2);
    ctx.fill();
  } else {
    const moonY = h * 0.08 + (nightness - 0.5) * h * 0.2;
    const mg = ctx.createRadialGradient(celestialX, moonY, 0, celestialX, moonY, 60);
    mg.addColorStop(0, 'rgba(210,220,255,0.9)');
    mg.addColorStop(0.3, 'rgba(180,190,240,0.2)');
    mg.addColorStop(1, 'rgba(180,190,240,0)');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.arc(celestialX, moonY, 60, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(210,220,255,0.85)';
    ctx.beginPath();
    ctx.arc(celestialX, moonY, 22, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ═══════════════════════════════════════════
// STARS
// ═══════════════════════════════════════════
const stars = [];
for (let i = 0; i < 500; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random() * 0.55,
    size: Math.random() * 2 + 0.3,
    ts: Math.random() * 0.004 + 0.001,
    phase: Math.random() * Math.PI * 2,
  });
}

function drawStars(time) {
  const ctx = ctxs.stars;
  const w = ctx.canvas.width;
  const h = ctx.canvas.height;
  ctx.clearRect(0, 0, w, h);
  const nightness = getTimeOfDay();
  if (nightness < 0.5) return;
  const a = Math.min(1, (nightness - 0.5) * 3);
  stars.forEach(s => {
    const tw = Math.sin(time * s.ts + s.phase) * 0.5 + 0.5;
    ctx.beginPath();
    ctx.arc(s.x * w, s.y * h, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,240,${a * (0.2 + tw * 0.8) * tw})`;
    ctx.fill();
    if (s.size > 1.8) {
      ctx.beginPath();
      ctx.arc(s.x * w, s.y * h, s.size * 4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,240,${a * tw * 0.08})`;
      ctx.fill();
    }
  });
}

// ═══════════════════════════════════════════
// COTTAGE SCENE (dock, chairs, trees, island)
// ═══════════════════════════════════════════
function drawScene() {
  const ctx = ctxs.scene;
  const w = ctx.canvas.width;
  const h = ctx.canvas.height;
  ctx.clearRect(0, 0, w, h);

  const nightness = getTimeOfDay();
  const b = 1 - nightness * 0.75;
  const waterline = h * 0.62;

  // Far shoreline / trees
  ctx.beginPath();
  ctx.moveTo(0, waterline - 20);
  for (let x = 0; x <= w; x += 3) {
    const y = waterline - 20 - Math.sin(x * 0.004) * 25 - Math.sin(x * 0.012) * 12 - Math.sin(x * 0.001 + 2) * 18;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, waterline);
  ctx.lineTo(0, waterline);
  ctx.closePath();
  ctx.fillStyle = `rgb(${Math.round(15 * b + 3)},${Math.round(30 * b + 5)},${Math.round(15 * b + 3)})`;
  ctx.fill();

  // Pine trees on far shore
  for (let i = 0; i < 60; i++) {
    const tx = (i / 60) * w + Math.sin(i * 5.1) * 20;
    const ty = waterline - 20 - Math.sin(tx * 0.004) * 25 - Math.sin(tx * 0.012) * 12 - Math.sin(tx * 0.001 + 2) * 18;
    const th = 12 + Math.sin(i * 3.1) * 8;
    ctx.fillStyle = `rgb(${Math.round(8 * b + 2)},${Math.round(22 * b + 3)},${Math.round(8 * b + 2)})`;
    ctx.beginPath();
    ctx.moveTo(tx - 4, ty);
    ctx.lineTo(tx, ty - th);
    ctx.lineTo(tx + 4, ty);
    ctx.closePath();
    ctx.fill();
  }

  // Small island in middle-left
  const islandX = w * 0.28;
  const islandY = waterline - 5;
  ctx.beginPath();
  ctx.ellipse(islandX, islandY, 50, 12, -0.05, 0, Math.PI * 2);
  ctx.fillStyle = `rgb(${Math.round(20 * b + 4)},${Math.round(35 * b + 5)},${Math.round(15 * b + 3)})`;
  ctx.fill();
  // Trees on island
  for (let i = 0; i < 8; i++) {
    const ix = islandX + Math.sin(i * 2.7) * 35;
    const iy = islandY - 2 + Math.cos(i * 3.1) * 4;
    const ih = 14 + Math.sin(i * 4.3) * 6;
    ctx.fillStyle = `rgb(${Math.round(6 * b + 2)},${Math.round(25 * b + 4)},${Math.round(6 * b + 2)})`;
    ctx.beginPath();
    ctx.moveTo(ix - 5, iy);
    ctx.lineTo(ix, iy - ih);
    ctx.lineTo(ix + 5, iy);
    ctx.closePath();
    ctx.fill();
  }

  // RIGHT SHORE - rocky outcrop with trees
  const shoreX = w * 0.75;
  ctx.beginPath();
  ctx.moveTo(w, waterline + 5);
  for (let x = w; x >= shoreX - 30; x -= 3) {
    const progress = (w - x) / (w - shoreX + 30);
    const y = waterline + 5 - progress * progress * 80 - Math.sin((w - x) * 0.03) * 8;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, waterline - 50);
  ctx.closePath();
  ctx.fillStyle = `rgb(${Math.round(25 * b + 5)},${Math.round(35 * b + 5)},${Math.round(20 * b + 4)})`;
  ctx.fill();

  // Trees on right shore
  for (let i = 0; i < 12; i++) {
    const rx = shoreX + 20 + i * 18 + Math.sin(i * 2.1) * 10;
    const ry = waterline - 10 - i * 8 + Math.sin(i * 1.7) * 5;
    const rh = 20 + Math.sin(i * 3.3) * 12;
    // Autumn colors for some trees
    const isAutumn = i % 3 === 0;
    if (isAutumn && b > 0.5) {
      ctx.fillStyle = `rgb(${Math.round(120 * b)},${Math.round(60 * b)},${Math.round(20 * b)})`;
    } else {
      ctx.fillStyle = `rgb(${Math.round(8 * b + 2)},${Math.round(28 * b + 4)},${Math.round(8 * b + 2)})`;
    }
    ctx.beginPath();
    ctx.moveTo(rx - 6, ry);
    ctx.lineTo(rx, ry - rh);
    ctx.lineTo(rx + 6, ry);
    ctx.closePath();
    ctx.fill();
  }

  // DOCK - wooden planks extending from right shore
  const dockStartX = shoreX - 10;
  const dockStartY = waterline + 15;
  const dockEndX = w * 0.35;
  const dockEndY = waterline + 25;
  const dockWidth = 80;

  // Dock shadow on water
  ctx.beginPath();
  ctx.moveTo(dockStartX, dockStartY + 5);
  ctx.lineTo(dockEndX, dockEndY + 5);
  ctx.lineTo(dockEndX + dockWidth * 0.8, dockEndY + 5);
  ctx.lineTo(dockStartX + dockWidth, dockStartY + 5);
  ctx.closePath();
  ctx.fillStyle = `rgba(0,0,0,${0.15 + nightness * 0.1})`;
  ctx.fill();

  // Dock posts
  ctx.fillStyle = `rgb(${Math.round(35 * b + 5)},${Math.round(28 * b + 4)},${Math.round(18 * b + 3)})`;
  for (let i = 0; i < 8; i++) {
    const t = i / 7;
    const px = dockStartX + (dockEndX - dockStartX) * t;
    const py = dockStartY + (dockEndY - dockStartY) * t;
    ctx.fillRect(px - 2, py, 4, 30 + t * 5);
  }

  // Dock planks
  const plankCount = 20;
  for (let i = 0; i <= plankCount; i++) {
    const t = i / plankCount;
    const px = dockStartX + (dockEndX - dockStartX) * t;
    const py = dockStartY + (dockEndY - dockStartY) * t;
    const pw = dockWidth * (1 - t * 0.2);

    // Wood color with variation
    const woodR = Math.round(130 * b + 20 + Math.sin(i * 1.3) * 10);
    const woodG = Math.round(95 * b + 15 + Math.sin(i * 0.9) * 8);
    const woodB = Math.round(55 * b + 10);
    ctx.fillStyle = `rgb(${woodR},${woodG},${woodB})`;

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(Math.atan2(dockEndY - dockStartY, dockEndX - dockStartX));
    ctx.fillRect(-pw / 2, -3, pw, 6);
    ctx.restore();

    // Plank gap
    ctx.strokeStyle = `rgba(0,0,0,${0.3 * b})`;
    ctx.lineWidth = 0.5;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(Math.atan2(dockEndY - dockStartY, dockEndX - dockStartX));
    ctx.beginPath();
    ctx.moveTo(-pw / 2, -3);
    ctx.lineTo(pw / 2, -3);
    ctx.stroke();
    ctx.restore();
  }

  // RED MUSKOKA CHAIR 1 (facing lake)
  const chair1X = w * 0.48;
  const chair1Y = waterline + 20;
  drawMuskokaChair(ctx, chair1X, chair1Y, 0.15, b, '#CC2222');

  // RED MUSKOKA CHAIR 2 (slightly behind, angled)
  const chair2X = w * 0.56;
  const chair2Y = waterline + 18;
  drawMuskokaChair(ctx, chair2X, chair2Y, 0.12, b, '#889977');

  // Small table between chairs
  ctx.fillStyle = `rgb(${Math.round(40 * b + 8)},${Math.round(30 * b + 5)},${Math.round(20 * b + 4)})`;
  const tableX = (chair1X + chair2X) / 2;
  const tableY = (chair1Y + chair2Y) / 2 - 5;
  ctx.beginPath();
  ctx.ellipse(tableX, tableY, 8, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(tableX - 1, tableY, 2, 8);

  // Coffee mug on table
  ctx.fillStyle = `rgb(${Math.round(180 * b + 20)},${Math.round(180 * b + 20)},${Math.round(170 * b + 20)})`;
  ctx.fillRect(tableX - 2, tableY - 5, 4, 5);
}

function drawMuskokaChair(ctx, x, y, scale, brightness, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  const r = parseInt(color.slice(1, 3), 16);
  const g = parseInt(color.slice(3, 5), 16);
  const b = parseInt(color.slice(5, 7), 16);

  // Back rest slats
  ctx.fillStyle = `rgb(${Math.round(r * brightness)},${Math.round(g * brightness)},${Math.round(b * brightness)})`;
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(-15 + i * 7, -50, 5, 45);
  }

  // Back top rail
  ctx.fillRect(-18, -52, 42, 4);

  // Seat
  ctx.fillRect(-22, -5, 50, 6);

  // Legs
  ctx.fillRect(-18, -5, 4, 30);
  ctx.fillRect(20, -5, 4, 30);
  ctx.fillRect(-14, -5, 3, 28);
  ctx.fillRect(16, -5, 3, 28);

  // Arm rests
  ctx.fillRect(-22, -25, 4, 22);
  ctx.fillRect(24, -25, 4, 22);
  ctx.fillRect(-22, -25, 50, 3);

  ctx.restore();
}

// ═══════════════════════════════════════════
// WATER
// ═══════════════════════════════════════════
function drawWater(time) {
  const ctx = ctxs.water;
  const w = ctx.canvas.width;
  const h = ctx.canvas.height;
  ctx.clearRect(0, 0, w, h);

  const nightness = getTimeOfDay();
  const waterStart = h * 0.62;
  const colors = getSkyColors(nightness);

  const grad = ctx.createLinearGradient(0, waterStart, 0, h);
  grad.addColorStop(0, `rgba(${Math.round(colors.bot[0] * 0.5)},${Math.round(colors.bot[1] * 0.5)},${Math.round(colors.bot[2] * 0.6)},0.7)`);
  grad.addColorStop(1, `rgba(${Math.max(0, Math.round(colors.top[0] * 0.2))},${Math.max(0, Math.round(colors.top[1] * 0.2))},${Math.round(colors.top[2] * 0.4)},1)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, waterStart, w, h - waterStart);

  // Ripples
  for (let y = waterStart; y < h; y += 2) {
    const p = (y - waterStart) / (h - waterStart);
    const a = 0.015 + p * 0.04;
    ctx.beginPath();
    for (let x = 0; x <= w; x += 3) {
      const wave = Math.sin(x * 0.012 + time * 0.0006 + y * 0.025) * (1 + p * 3)
                 + Math.sin(x * 0.025 + time * 0.001) * p * 1.5;
      x === 0 ? ctx.moveTo(x, y + wave) : ctx.lineTo(x, y + wave);
    }
    ctx.strokeStyle = `rgba(255,255,255,${a})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Celestial reflection
  const reflX = w * (0.35 + Math.sin(nightness * Math.PI) * 0.35);
  for (let y = waterStart; y < waterStart + 100; y += 2) {
    const p = (y - waterStart) / 100;
    const shimmer = Math.sin(y * 0.06 + time * 0.0015) * 0.5 + 0.5;
    const ww = 25 + Math.sin(time * 0.0006 + y * 0.03) * 12;
    ctx.beginPath();
    ctx.moveTo(reflX - ww * (1 - p), y);
    ctx.lineTo(reflX + ww * (1 - p), y);
    ctx.strokeStyle = nightness < 0.5
      ? `rgba(255,220,100,${shimmer * 0.15 * (1 - p)})`
      : `rgba(200,210,255,${shimmer * 0.12 * (1 - p)})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Dock reflection
  const dockStartX = w * 0.75 - 10;
  const dockEndX = w * 0.35;
  ctx.strokeStyle = `rgba(30,25,15,${0.2 * (1 - nightness * 0.4)})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(dockStartX, waterStart + 20);
  ctx.lineTo(dockEndX, waterStart + 30);
  ctx.stroke();
}

// ═══════════════════════════════════════════
// FIREFLIES
// ═══════════════════════════════════════════
const fireflies = [];
for (let i = 0; i < 30; i++) {
  fireflies.push({
    x: 0.15 + Math.random() * 0.7,
    y: 0.3 + Math.random() * 0.3,
    vx: (Math.random() - 0.5) * 0.0004,
    vy: (Math.random() - 0.5) * 0.0003,
    size: Math.random() * 2 + 1,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.002 + 0.001,
  });
}

function drawParticles(time) {
  const ctx = ctxs.particles;
  const w = ctx.canvas.width;
  const h = ctx.canvas.height;
  ctx.clearRect(0, 0, w, h);

  const nightness = getTimeOfDay();
  if (nightness < 0.5) return;
  const a = (nightness - 0.5) * 2;

  fireflies.forEach(f => {
    f.x += f.vx + Math.sin(time * f.speed + f.phase) * 0.0003;
    f.y += f.vy + Math.cos(time * f.speed * 0.7 + f.phase) * 0.0002;
    if (f.x < 0.05) f.x = 0.95;
    if (f.x > 0.95) f.x = 0.05;
    if (f.y < 0.25) f.y = 0.6;
    if (f.y > 0.6) f.y = 0.25;

    const glow = Math.sin(time * f.speed * 3 + f.phase) * 0.5 + 0.5;
    const alpha = a * glow * 0.7;

    const g = ctx.createRadialGradient(f.x * w, f.y * h, 0, f.x * w, f.y * h, f.size * 5);
    g.addColorStop(0, `rgba(255,255,150,${alpha * 0.5})`);
    g.addColorStop(0.3, `rgba(255,220,100,${alpha * 0.15})`);
    g.addColorStop(1, 'rgba(255,220,100,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(f.x * w, f.y * h, f.size * 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(255,255,200,${alpha})`;
    ctx.beginPath();
    ctx.arc(f.x * w, f.y * h, f.size, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ═══════════════════════════════════════════
// CLOCK
// ═══════════════════════════════════════════
const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  document.getElementById('timeDisplay').textContent = `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`;
  document.getElementById('dateDisplay').textContent = `${days[now.getDay()]} · ${months[now.getMonth()]} ${now.getDate()}`;
}
setInterval(updateClock, 1000);
updateClock();

// ═══════════════════════════════════════════
// LOOP
// ═══════════════════════════════════════════
let fc = 0;
function animate(time) {
  fc++;
  if (fc % 3 === 0) { drawSky(); drawScene(); }
  drawStars(time);
  drawWater(time);
  drawParticles(time);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
