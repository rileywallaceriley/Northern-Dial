<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cottage Lake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: 'Helvetica Neue', sans-serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  #sky { z-index: 1; }
  #stars { z-index: 2; }
  #scene { z-index: 3; }
  #water { z-index: 4; }
  #particles { z-index: 5; }

  .clock {
    position: fixed;
    top: 32px;
    right: 36px;
    z-index: 100;
    text-align: right;
    user-select: none;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 14px 22px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .clock .time {
    font-size: clamp(26px, 3.5vw, 48px);
    font-weight: 200;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 2px 20px rgba(0,0,0,0.6);
  }
  .clock .date {
    font-size: clamp(10px, 1.2vw, 14px);
    font-weight: 300;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
    text-shadow: 0 1px 10px rgba(0,0,0,0.6);
  }
  .clock .location {
    font-size: clamp(8px, 0.9vw, 11px);
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-top: 6px;
    text-shadow: 0 1px 10px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="stars"></canvas>
<canvas id="scene"></canvas>
<canvas id="water"></canvas>
<canvas id="particles"></canvas>

<div class="clock">
  <div class="time" id="timeDisplay"></div>
  <div class="date" id="dateDisplay"></div>
</div>

<script>
const canvases = {};
const ctxs = {};
['sky', 'stars', 'scene', 'water', 'particles'].forEach(id => {
  canvases[id] = document.getElementById(id);
  ctxs[id] = canvases[id].getContext('2d');
});

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  Object.values(canvases).forEach(c => { c.width = w; c.height = h; });
  drawScene();
}
window.addEventListener('resize', resize);
resize();

function getTimeOfDay() {
  const now = new Date();
  const hours = now.getHours() + now.getMinutes() / 60;
  if (hours >= 5 && hours < 21) {
    return Math.abs(hours - 14) / 9 * 0.3;
  } else {
    const nightHours = hours >= 21 ? hours - 21 : hours + 3;
    return 0.3 + Math.min(nightHours / 6, 1) * 0.7;
  }
}

function getSkyColors(n) {
  const dayT = [80,150,220], dayB = [170,210,240];
  const nightT = [8,8,30], nightB = [20,18,50];
  const dawnT = [140,70,90], dawnB = [230,130,70];
  const duskT = [100,50,70], duskB = [210,110,50];
  let t, b;
  if (n < 0.3) { t = dayT; b = dayB; }
  else if (n < 0.5) { const f = (n-0.3)/0.2; t = dayT.map((c,i)=>c+(duskT[i]-c)*f); b = dayB.map((c,i)=>c+(duskB[i]-c)*f); }
  else if (n < 0.6) { const f = (n-0.5)/0.1; t = duskT.map((c,i)=>c+(nightT[i]-c)*f); b = duskB.map((c,i)=>c+(nightB[i]-c)*f); }
  else if (n < 0.7) { t = nightT; b = nightB; }
  else if (n < 0.85) { const f = (n-0.7)/0.15; t = nightT.map((c,i)=>c+(dawnT[i]-c)*(1-f)); b = nightB.map((c,i)=>c+(dawnB[i]-c)*(1-f)); }
  else { const f = (n-0.85)/0.15; t = dawnT.map((c,i)=>c+(dayT[i]-c)*f); b = dawnB.map((c,i)=>c+(dayB[i]-c)*f); }
  return { top: t.map(Math.round), bot: b.map(Math.round) };
}

function drawSky() {
  const ctx = ctxs.sky;
  const w = ctx.canvas.width, h = ctx.canvas.height;
  const n = getTimeOfDay();
  const c = getSkyColors(n);
  const g = ctx.createLinearGradient(0, 0, 0, h * 0.7);
  g.addColorStop(0, `rgb(${c.top[0]},${c.top[1]},${c.top[2]})`);
  g.addColorStop(1, `rgb(${c.bot[0]},${c.bot[1]},${c.bot[2]})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  const cx = w * (0.35 + Math.sin(n * Math.PI) * 0.35);
  if (n < 0.5) {
    const sy = h * 0.1 + n * h * 0.25;
    const sg = ctx.createRadialGradient(cx, sy, 0, cx, sy, 100);
    sg.addColorStop(0, 'rgba(255,245,190,1)');
    sg.addColorStop(0.15, 'rgba(255,230,120,0.9)');
    sg.addColorStop(0.4, 'rgba(255,200,80,0.15)');
    sg.addColorStop(1, 'rgba(255,200,80,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(cx, sy, 100, 0, Math.PI * 2);
    ctx.fill();
  } else {
    const my = h * 0.06 + (n - 0.5) * h * 0.2;
    const mg = ctx.createRadialGradient(cx, my, 0, cx, my, 60);
    mg.addColorStop(0, 'rgba(210,220,255,0.9)');
    mg.addColorStop(0.3, 'rgba(180,190,240,0.2)');
    mg.addColorStop(1, 'rgba(180,190,240,0)');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.arc(cx, my, 60, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(210,220,255,0.85)';
    ctx.beginPath();
    ctx.arc(cx, my, 22, 0, Math.PI * 2);
    ctx.fill();
  }
}

const stars = [];
for (let i = 0; i < 500; i++) stars.push({ x: Math.random(), y: Math.random() * 0.55, s: Math.random() * 2 + 0.3, ts: Math.random() * 0.004 + 0.001, ph: Math.random() * Math.PI * 2 });

function drawStars(t) {
  const ctx = ctxs.stars;
  const w = ctx.canvas.width, h = ctx.canvas.height;
  ctx.clearRect(0, 0, w, h);
  const n = getTimeOfDay();
  if (n < 0.5) return;
  const a = Math.min(1, (n - 0.5) * 3);
  stars.forEach(s => {
    const tw = Math.sin(t * s.ts + s.ph) * 0.5 + 0.5;
    ctx.beginPath();
    ctx.arc(s.x * w, s.y * h, s.s, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,240,${a * (0.2 + tw * 0.8) * tw})`;
    ctx.fill();
    if (s.s > 1.8) {
      ctx.beginPath();
      ctx.arc(s.x * w, s.y * h, s.s * 4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,240,${a * tw * 0.08})`;
      ctx.fill();
    }
  });
}

function drawScene() {
  const ctx = ctxs.scene;
  const w = ctx.canvas.width, h = ctx.canvas.height;
  ctx.clearRect(0, 0, w, h);

  const n = getTimeOfDay();
  const b = 1 - n * 0.75;
  const wl = h * 0.62; // waterline

  // FAR SHORELINE (across the lake)
  ctx.beginPath();
  ctx.moveTo(0, wl - 30);
  for (let x = 0; x <= w * 0.7; x += 3) {
    const y = wl - 30 - Math.sin(x * 0.003) * 20 - Math.sin(x * 0.008 + 1) * 10 - Math.sin(x * 0.001) * 15;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w * 0.7, wl);
  ctx.lineTo(0, wl);
  ctx.closePath();
  ctx.fillStyle = `rgb(${Math.round(18 * b + 4)},${Math.round(32 * b + 6)},${Math.round(18 * b + 4)})`;
  ctx.fill();

  // Far shore trees
  for (let i = 0; i < 40; i++) {
    const tx = (i / 40) * w * 0.7 + Math.sin(i * 4.1) * 15;
    const ty = wl - 30 - Math.sin(tx * 0.003) * 20 - Math.sin(tx * 0.008 + 1) * 10 - Math.sin(tx * 0.001) * 15;
    const th = 10 + Math.sin(i * 2.7) * 6;
    ctx.fillStyle = `rgb(${Math.round(10 * b + 2)},${Math.round(25 * b + 4)},${Math.round(10 * b + 2)})`;
    ctx.beginPath();
    ctx.moveTo(tx - 4, ty);
    ctx.lineTo(tx, ty - th);
    ctx.lineTo(tx + 4, ty);
    ctx.closePath();
    ctx.fill();
  }

  // ISLAND in middle distance
  const ix = w * 0.22, iy = wl - 8;
  ctx.beginPath();
  ctx.ellipse(ix, iy, 40, 10, -0.05, 0, Math.PI * 2);
  ctx.fillStyle = `rgb(${Math.round(22 * b + 5)},${Math.round(38 * b + 6)},${Math.round(18 * b + 4)})`;
  ctx.fill();
  for (let i = 0; i < 6; i++) {
    const tix = ix + Math.sin(i * 2.7) * 28;
    const tiy = iy - 2 + Math.cos(i * 3.1) * 3;
    const tih = 12 + Math.sin(i * 4.3) * 5;
    ctx.fillStyle = `rgb(${Math.round(8 * b + 2)},${Math.round(26 * b + 4)},${Math.round(8 * b + 2)})`;
    ctx.beginPath();
    ctx.moveTo(tix - 4, tiy);
    ctx.lineTo(tix, tiy - tih);
    ctx.lineTo(tix + 4, tiy);
    ctx.closePath();
    ctx.fill();
  }

  // RIGHT SHORE - rocky/grassy bank with trees (like the reference photo)
  // The shore occupies the right side of the screen, extending from top to waterline
  ctx.beginPath();
  ctx.moveTo(w, 0);
  ctx.lineTo(w * 0.55, 0);
  // Shoreline curves down to water
  for (let x = w * 0.55; x <= w; x += 3) {
    const t = (x - w * 0.55) / (w * 0.45);
    const shoreY = t * t * wl * 0.7 + Math.sin((x - w * 0.55) * 0.02) * 5;
    ctx.lineTo(x, shoreY);
  }
  ctx.lineTo(w, wl + 5);
  ctx.closePath();
  ctx.fillStyle = `rgb(${Math.round(35 * b + 8)},${Math.round(45 * b + 10)},${Math.round(25 * b + 6)})`;
  ctx.fill();

  // Grass/ground texture on shore
  ctx.fillStyle = `rgb(${Math.round(30 * b + 6)},${Math.round(42 * b + 8)},${Math.round(20 * b + 4)})`;
  ctx.beginPath();
  ctx.moveTo(w * 0.58, 0);
  for (let x = w * 0.58; x <= w; x += 3) {
    const t = (x - w * 0.58) / (w * 0.42);
    const y = t * t * wl * 0.65 + Math.sin((x - w * 0.58) * 0.025) * 4;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, wl * 0.5);
  ctx.lineTo(w * 0.58, 0);
  ctx.closePath();
  ctx.fill();

  // Trees on right shore - mixed pines and deciduous (autumn colours)
  const shoreTrees = [
    { x: 0.62, h: 35, type: 'pine' },
    { x: 0.68, h: 45, type: 'pine' },
    { x: 0.72, h: 30, type: 'deciduous' },
    { x: 0.76, h: 40, type: 'pine' },
    { x: 0.80, h: 28, type: 'deciduous' },
    { x: 0.84, h: 38, type: 'pine' },
    { x: 0.88, h: 32, type: 'deciduous' },
    { x: 0.92, h: 42, type: 'pine' },
    { x: 0.96, h: 36, type: 'pine' },
    { x: 0.70, h: 25, type: 'deciduous' },
    { x: 0.78, h: 33, type: 'pine' },
    { x: 0.86, h: 29, type: 'deciduous' },
  ];

  shoreTrees.forEach((tree, i) => {
    const tx = tree.x * w;
    const t = (tree.x - 0.55) / 0.45;
    const ty = t * t * wl * 0.68 + Math.sin((tx - w * 0.55) * 0.02) * 4;
    const th = tree.h * (0.8 + Math.sin(i * 1.7) * 0.2);

    if (tree.type === 'pine') {
      ctx.fillStyle = `rgb(${Math.round(8 * b + 2)},${Math.round(28 * b + 5)},${Math.round(8 * b + 2)})`;
      ctx.beginPath();
      ctx.moveTo(tx - 6, ty);
      ctx.lineTo(tx, ty - th);
      ctx.lineTo(tx + 6, ty);
      ctx.closePath();
      ctx.fill();
      // Second layer
      ctx.beginPath();
      ctx.moveTo(tx - 8, ty - th * 0.4);
      ctx.lineTo(tx, ty - th * 1.1);
      ctx.lineTo(tx + 8, ty - th * 0.4);
      ctx.closePath();
      ctx.fill();
    } else {
      // Deciduous with autumn colours
      const autumnR = Math.round(160 * b + 20);
      const autumnG = Math.round(80 * b + 15);
      const autumnB = Math.round(20 * b + 5);
      ctx.fillStyle = `rgb(${autumnR},${autumnG},${autumnB})`;
      ctx.beginPath();
      ctx.arc(tx, ty - th * 0.6, th * 0.45, 0, Math.PI * 2);
      ctx.fill();
      // Trunk
      ctx.fillStyle = `rgb(${Math.round(50 * b + 10)},${Math.round(35 * b + 8)},${Math.round(20 * b + 5)})`;
      ctx.fillRect(tx - 2, ty - th * 0.3, 4, th * 0.3);
    }
  });

  // DOCK - anchored into the right shore, extending into the lake
  // Dock starts at the shore edge and angles out into the water
  const dockShoreX = w * 0.65;
  const dockShoreY = wl * 0.55;
  const dockEndX = w * 0.3;
  const dockEndY = wl + 10;
  const dockW = 70;

  const dockAngle = Math.atan2(dockEndY - dockShoreY, dockEndX - dockShoreX);

  // Dock posts (pilings)
  ctx.fillStyle = `rgb(${Math.round(40 * b + 8)},${Math.round(32 * b + 6)},${Math.round(20 * b + 4)})`;
  for (let i = 0; i <= 6; i++) {
    const t = i / 6;
    const px = dockShoreX + (dockEndX - dockShoreX) * t;
    const py = dockShoreY + (dockEndY - dockShoreY) * t;
    const postH = 15 + t * 10;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(dockAngle);
    ctx.fillRect(-2, -3, 4, postH);
    ctx.restore();
  }

  // Dock shadow on water
  ctx.beginPath();
  ctx.moveTo(dockShoreX, dockShoreY + 5);
  ctx.lineTo(dockEndX, dockEndY + 5);
  ctx.lineTo(dockEndX + dockW * 0.7, dockEndY + 5);
  ctx.lineTo(dockShoreX + dockW, dockShoreY + 5);
  ctx.closePath();
  ctx.fillStyle = `rgba(0,0,0,${0.12 + n * 0.08})`;
  ctx.fill();

  // Dock planks
  const plankN = 25;
  for (let i = 0; i <= plankN; i++) {
    const t = i / plankN;
    const px = dockShoreX + (dockEndX - dockShoreX) * t;
    const py = dockShoreY + (dockEndY - dockShoreY) * t;
    const pw = dockW * (1 - t * 0.15);

    const wR = Math.round(135 * b + 25 + Math.sin(i * 1.3) * 8);
    const wG = Math.round(100 * b + 18 + Math.sin(i * 0.9) * 6);
    const wB = Math.round(58 * b + 12);
    ctx.fillStyle = `rgb(${wR},${wG},${wB})`;

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(dockAngle);
    ctx.fillRect(-pw / 2, -3, pw, 6);
    // Plank gap line
    ctx.strokeStyle = `rgba(0,0,0,${0.25 * b})`;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(-pw / 2, -3);
    ctx.lineTo(pw / 2, -3);
    ctx.stroke();
    ctx.restore();
  }

  // Dock railing (optional, subtle)
  ctx.strokeStyle = `rgb(${Math.round(50 * b + 10)},${Math.round(40 * b + 8)},${Math.round(25 * b + 5)})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(dockShoreX + 5, dockShoreY - 12);
  ctx.lineTo(dockEndX + 5, dockEndY - 12);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(dockShoreX + dockW - 5, dockShoreY - 12);
  ctx.lineTo(dockEndX + dockW * 0.7 - 5, dockEndY - 12);
  ctx.stroke();

  // Railing posts
  for (let i = 0; i <= 5; i++) {
    const t = i / 5;
    const px = dockShoreX + (dockEndX - dockShoreX) * t;
    const py = dockShoreY + (dockEndY - dockShoreY) * t;
    ctx.fillStyle = `rgb(${Math.round(45 * b + 9)},${Math.round(35 * b + 7)},${Math.round(22 * b + 5)})`;
    ctx.save();
    ctx.translate(px + 5, py - 12);
    ctx.rotate(dockAngle);
    ctx.fillRect(-1.5, 0, 3, 12);
    ctx.restore();
    ctx.save();
    ctx.translate(px + dockW - 5, py - 12);
    ctx.rotate(dockAngle);
    ctx.fillRect(-1.5, 0, 3, 12);
    ctx.restore();
  }

  // RED MUSKOKA CHAIR 1 - facing the lake
  drawMuskokaChair(ctx, w * 0.42, wl + 5, 0.7, b, '#CC2222');

  // RED MUSKOKA CHAIR 2 - slightly behind, angled
  drawMuskokaChair(ctx, w * 0.50, wl + 2, 0.65, b, '#8B7D6B');

  // Small side table
  ctx.fillStyle = `rgb(${Math.round(45 * b + 9)},${Math.round(35 * b + 7)},${Math.round(22 * b + 5)})`;
  const tbX = w * 0.46, tbY = wl + 3;
  ctx.beginPath();
  ctx.ellipse(tbX, tbY, 6, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(tbX - 1, tbY, 2, 7);

  // Coffee mug on table
  ctx.fillStyle = `rgb(${Math.round(190 * b + 25)},${Math.round(190 * b + 25)},${Math.round(180 * b + 22)})`;
  ctx.fillRect(tbX - 2, tbY - 4, 4, 4);

  // Red patio umbrella (closed) beside dock
  const umbX = w * 0.58, umbY = wl - 5;
  ctx.fillStyle = `rgb(${Math.round(50 * b + 10)},${Math.round(40 * b + 8)},${Math.round(25 * b + 5)})`;
  ctx.fillRect(umbX - 1.5, umbY - 50, 3, 50);
  // Closed umbrella canopy
  ctx.fillStyle = `rgb(${Math.round(180 * b + 20)},${Math.round(40 * b + 8)},${Math.round(30 * b + 6)})`;
  ctx.beginPath();
  ctx.moveTo(umbX, umbY - 52);
  ctx.lineTo(umbX - 6, umbY - 48);
  ctx.lineTo(umbX + 6, umbY - 48);
  ctx.closePath();
  ctx.fill();
}

function drawMuskokaChair(ctx, x, y, scale, b, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  const r = parseInt(color.slice(1, 3), 16);
  const g = parseInt(color.slice(3, 5), 16);
  const bl = parseInt(color.slice(5, 7), 16);
  const c = `rgb(${Math.round(r * b)},${Math.round(g * b)},${Math.round(bl * b)})`;

  ctx.fillStyle = c;

  // Back slats
  for (let i = 0; i < 5; i++) ctx.fillRect(-15 + i * 7, -50, 5, 45);
  // Top rail
  ctx.fillRect(-18, -52, 42, 4);
  // Seat
  ctx.fillRect(-22, -5, 50, 6);
  // Legs
  ctx.fillRect(-18, -5, 4, 30);
  ctx.fillRect(20, -5, 4, 30);
  ctx.fillRect(-14, -5, 3, 28);
  ctx.fillRect(16, -5, 3, 28);
  // Arms
  ctx.fillRect(-22, -25, 4, 22);
  ctx.fillRect(24, -25, 4, 22);
  ctx.fillRect(-22, -25, 50, 3);

  ctx.restore();
}

function drawWater(t) {
  const ctx = ctxs.water;
  const w = ctx.canvas.width, h = ctx.canvas.height;
  ctx.clearRect(0, 0, w, h);

  const n = getTimeOfDay();
  const ws = h * 0.62;
  const c = getSkyColors(n);

  const g = ctx.createLinearGradient(0, ws, 0, h);
  g.addColorStop(0, `rgba(${Math.round(c.bot[0] * 0.5)},${Math.round(c.bot[1] * 0.5)},${Math.round(c.bot[2] * 0.6)},0.7)`);
  g.addColorStop(1, `rgba(${Math.max(0, Math.round(c.top[0] * 0.2))},${Math.max(0, Math.round(c.top[1] * 0.2))},${Math.round(c.top[2] * 0.4)},1)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, ws, w, h - ws);

  for (let y = ws; y < h; y += 2) {
    const p = (y - ws) / (h - ws);
    const a = 0.015 + p * 0.04;
    ctx.beginPath();
    for (let x = 0; x <= w; x += 3) {
      const wave = Math.sin(x * 0.012 + t * 0.0006 + y * 0.025) * (1 + p * 3) + Math.sin(x * 0.025 + t * 0.001) * p * 1.5;
      x === 0 ? ctx.moveTo(x, y + wave) : ctx.lineTo(x, y + wave);
    }
    ctx.strokeStyle = `rgba(255,255,255,${a})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  const rx = w * (0.35 + Math.sin(n * Math.PI) * 0.35);
  for (let y = ws; y < ws + 100; y += 2) {
    const p = (y - ws) / 100;
    const sh = Math.sin(y * 0.06 + t * 0.0015) * 0.5 + 0.5;
    const ww = 25 + Math.sin(t * 0.0006 + y * 0.03) * 12;
    ctx.beginPath();
    ctx.moveTo(rx - ww * (1 - p), y);
    ctx.lineTo(rx + ww * (1 - p), y);
    ctx.strokeStyle = n < 0.5 ? `rgba(255,220,100,${sh * 0.15 * (1 - p)})` : `rgba(200,210,255,${sh * 0.12 * (1 - p)})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

const fireflies = [];
for (let i = 0; i < 30; i++) fireflies.push({ x: 0.15 + Math.random() * 0.5, y: 0.3 + Math.random() * 0.3, vx: (Math.random() - 0.5) * 0.0004, vy: (Math.random() - 0.5) * 0.0003, s: Math.random() * 2 + 1, ph: Math.random() * Math.PI * 2, sp: Math.random() * 0.002 + 0.001 });

function drawParticles(t) {
  const ctx = ctxs.particles;
  const w = ctx.canvas.width, h = ctx.canvas.height;
  ctx.clearRect(0, 0, w, h);
  const n = getTimeOfDay();
  if (n < 0.5) return;
  const a = (n - 0.5) * 2;
  fireflies.forEach(f => {
    f.x += f.vx + Math.sin(t * f.sp + f.ph) * 0.0003;
    f.y += f.vy + Math.cos(t * f.sp * 0.7 + f.ph) * 0.0002;
    if (f.x < 0.05) f.x = 0.65;
    if (f.x > 0.65) f.x = 0.05;
    if (f.y < 0.25) f.y = 0.6;
    if (f.y > 0.6) f.y = 0.25;
    const gl = Math.sin(t * f.sp * 3 + f.ph) * 0.5 + 0.5;
    const al = a * gl * 0.7;
    const g = ctx.createRadialGradient(f.x * w, f.y * h, 0, f.x * w, f.y * h, f.s * 5);
    g.addColorStop(0, `rgba(255,255,150,${al * 0.5})`);
    g.addColorStop(0.3, `rgba(255,220,100,${al * 0.15})`);
    g.addColorStop(1, 'rgba(255,220,100,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(f.x * w, f.y * h, f.s * 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255,255,200,${al})`;
    ctx.beginPath();
    ctx.arc(f.x * w, f.y * h, f.s, 0, Math.PI * 2);
    ctx.fill();
  });
}

const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function updateClock() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  document.getElementById('timeDisplay').textContent = `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`;
  document.getElementById('dateDisplay').textContent = `${days[now.getDay()]} · ${months[now.getMonth()]} ${now.getDate()}`;
}
setInterval(updateClock, 1000);
updateClock();

let fc = 0;
function animate(t) {
  fc++;
  if (fc % 3 === 0) { drawSky(); drawScene(); }
  drawStars(t);
  drawWater(t);
  drawParticles(t);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
