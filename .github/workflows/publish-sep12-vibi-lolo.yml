name: Publish Sept 12 VIBI and LØLØ

on:
  push:
    paths:
      - 'tools/publish_sep12_vibi_lolo.py'
      - '.github/workflows/publish-sep12-vibi-lolo.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add VIBI and LØLØ cards
        run: python tools/publish_sep12_vibi_lolo.py
      - name: Commit publication cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/index.html index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Publish VIBI and LØLØ stories to indexes'
          git pull --rebase origin main
          git push origin HEAD:main
