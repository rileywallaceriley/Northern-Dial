name: Update artist feature media

on:
  push:
    paths:
      - '.github/workflows/update-artist-feature-media.yml'

permissions:
  contents: write

jobs:
  update-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add YouTube embeds and artist profile links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = {
              "blog/enola-bedard.html": ("enola-bedard", "Enola Bédard", "d5valSPWtaU", "Enola Bédard — Unavez official music video"),
              "blog/ghostboyrj.html": ("ghostboyrj", "Ghostboyrj", "IXHMbu_G3so", "Ghostboyrj — Cartoons & Cereal Intro (Official Video)"),
              "blog/haley-smalls.html": ("haley-smalls", "Haley Smalls", "OJlFbow63fY", "Haley Smalls — Matches"),
              "blog/koko-love.html": ("koko-love", "Koko Love", "sjOAyC2JZ2Y", "Koko Love — The Cost of Freedom (Live)"),
              "blog/lia-pappas-kemps.html": ("lia-pappas-kemps", "Lia Pappas-Kemps", "3DMSt6uTwVs", "Lia Pappas-Kemps — Towers (Official Video)"),
              "blog/livingthing.html": ("livingthing", "livingthing", "EBt8k2ZUYgg", "livingthing — auburn (Official Lyric Video)"),
              "blog/lov.html": ("lov", "LÖV", "AEKT4RYj9_w", "LÖV — Mama (Official Music Video)"),
              "blog/puma-june.html": ("puma-june", "Puma June", "Vk0KPDApOQk", "Puma June — Bad Habits (Official Video)"),
              "blog/tauro.html": ("tauro", "TAURO", "01iUyzfWkqQ", "TAURO — Great Minds (Official Video)"),
          }

          video_css = '''
    .nd-video{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;margin:28px 0;border-radius:8px;background:#111}
    .nd-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
'''

          def body_bounds(html):
              marker = '<div class="article-body">'
              start = html.find(marker)
              if start < 0:
                  raise RuntimeError('article-body not found')
              content_start = start + len(marker)
              match = re.search(r'\n\s*</div>\s*\n\s*<section\b', html[content_start:])
              if not match:
                  raise RuntimeError('article-body boundary not found')
              return content_start, content_start + match.start()

          changed = []
          for filename, (slug, artist, video_id, video_title) in targets.items():
              path = Path(filename)
              profile = Path('artists') / f'{slug}.html'
              if not path.exists() or not profile.exists():
                  raise FileNotFoundError(f'Missing feature/profile for {artist}')
              html = path.read_text(encoding='utf-8')
              original = html

              if video_id not in html:
                  if '.nd-video{' not in html:
                      style_close = html.find('</style>')
                      if style_close < 0:
                          raise RuntimeError(f'style block not found in {filename}')
                      html = html[:style_close] + video_css + html[style_close:]
                  content_start, body_end = body_bounds(html)
                  body = html[content_start:body_end]
                  first_p = re.search(r'<p(?:\s[^>]*)?>.*?</p>', body, re.S)
                  if not first_p:
                      raise RuntimeError(f'first paragraph not found in {filename}')
                  insert_at = content_start + first_p.end()
                  embed = (f'\n      <div class="nd-video"><iframe src="https://www.youtube.com/embed/{video_id}" '
                           f'title="{video_title}" loading="lazy" '
                           'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" '
                           'allowfullscreen></iframe></div>')
                  html = html[:insert_at] + embed + html[insert_at:]

              profile_href = f'../artists/{slug}.html'
              if profile_href not in html:
                  content_start, body_end = body_bounds(html)
                  link = (f'\n      <p class="artist-profile-link"><a href="{profile_href}" '
                          'style="color:#CC3333;text-decoration:underline;font-weight:700;">'
                          f'Explore {artist}’s Northern Dial artist profile →</a></p>')
                  html = html[:body_end] + link + html[body_end:]

              if html != original:
                  path.write_text(html, encoding='utf-8')
                  changed.append(filename)

          print('Updated:', ', '.join(changed))
          PY
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/*.html
          git diff --cached --check
          git commit -m "Add videos and artist profile links to features"
          git push
