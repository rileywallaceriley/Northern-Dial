name: Restore homepage special shell

on:
  push:
    paths:
      - 'restore_homepage_shell.py'
      - '.github/workflows/cleanup-duplicate-shells.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore homepage shell
        run: python3 restore_homepage_shell.py

      - name: Commit homepage shell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage shell changes to commit.'
            exit 0
          fi
          git commit -m 'Restore homepage large logo and condensed sticky nav'
          git push origin HEAD:main
