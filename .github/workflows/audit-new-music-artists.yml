name: Audit new music artists

on:
  push:
    paths:
      - '.github/workflows/audit-new-music-artists.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compare live station catalogue with artist directory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          from build_artists import catalogue_rows, build_catalogue, slugify, load_enrichments

          rows = catalogue_rows()
          by_artist = build_catalogue(rows)
          live_artists = sorted(by_artist, key=str.casefold)

          baseline_path = Path('library_artists.txt')
          baseline = []
          if baseline_path.exists():
              baseline = [
                  line.strip() for line in baseline_path.read_text(encoding='utf-8').splitlines()
                  if line.strip()
              ]
          baseline_keys = {name.casefold() for name in baseline}
          new_artists = [name for name in live_artists if name.casefold() not in baseline_keys]

          directory_html = Path('artists.html').read_text(encoding='utf-8')
          profiles_raw = json.loads(Path('artist_profiles.json').read_text(encoding='utf-8')) if Path('artist_profiles.json').exists() else {}
          profiles = {str(k).casefold(): v for k, v in profiles_raw.items() if isinstance(v, dict)}
          enrichments = load_enrichments()

          def source_record(name):
              key = name.casefold()
              data = {}
              if isinstance(profiles.get(key), dict):
                  data.update(profiles[key])
              if isinstance(enrichments.get(key), dict):
                  data.update(enrichments[key])
              return data

          checks = []
          for name in new_artists:
              slug = slugify(name)
              profile_file = Path('artists') / f'{slug}.html'
              record = source_record(name)
              has_bio = bool(record.get('bio'))
              in_directory = f'id="artist-{slug}"' in directory_html or f"data-artist=\"{name}\"" in directory_html
              has_profile_link = f'./artists/{slug}.html' in directory_html
              checks.append({
                  'artist': name,
                  'slug': slug,
                  'track_count': len(by_artist[name]),
                  'tracks': sorted({track['title'] for track in by_artist[name]}, key=str.casefold),
                  'in_directory': in_directory,
                  'has_source_bio': has_bio,
                  'has_profile_file': profile_file.is_file(),
                  'directory_has_profile_link': has_profile_link,
              })

          global_missing_directory = []
          for name in live_artists:
              slug = slugify(name)
              if f'id="artist-{slug}"' not in directory_html and f"data-artist=\"{name}\"" not in directory_html:
                  global_missing_directory.append(name)

          report = {
              'checked_at_utc': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'live_catalogue_rows': len(rows),
              'live_artist_count': len(live_artists),
              'baseline_artist_count': len(baseline),
              'new_artist_count': len(new_artists),
              'new_artists': checks,
              'new_missing_directory_count': sum(not x['in_directory'] for x in checks),
              'new_missing_profile_count': sum(not x['has_profile_file'] for x in checks),
              'new_missing_bio_count': sum(not x['has_source_bio'] for x in checks),
              'global_missing_directory_count': len(global_missing_directory),
              'global_missing_directory': global_missing_directory,
          }

          Path('data').mkdir(exist_ok=True)
          Path('data/current_new_music_artist_audit.json').write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8'
          )

          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_new_music_artist_audit.json
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi
          git commit -m "Audit new music artists against directory"
          git pull --rebase origin main
          git push
