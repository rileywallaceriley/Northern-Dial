name: Deploy site to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: ['Build French artist pages']
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate deployment secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY_B64 VPS_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy site files
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          rsync -az             --exclude='.git/'             --exclude='.github/'             --exclude='.gitignore'             --exclude='tools/'             --exclude='scripts/'             --exclude='data/'             --exclude='archives/'             --exclude='artist_enrichment_batches/'             --exclude='*.py'             --exclude='*.md'             -e "ssh -i ~/.ssh/id_ed25519 -p $PORT"             ./ "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      - name: Verify deployed files on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" "$VPS_USER@$VPS_HOST" "bash -s" <<EOF
          set -euo pipefail
          test -s "$VPS_PATH/index.html"
          test -s "$VPS_PATH/nd-shell.js"
          test -s "$VPS_PATH/homepage.js"
          grep -Fq "homepage.js?v=20260927e" "$VPS_PATH/index.html"
          grep -Fq "nd-shell.css?v=20260927e" "$VPS_PATH/index.html"
          grep -Fq "nd-shell.js?v=20260927e" "$VPS_PATH/index.html"
          grep -Fq "window.NDPlayer" "$VPS_PATH/nd-shell.js"
          grep -Fq "persistentController" "$VPS_PATH/homepage.js"
          echo "VPS player files match the unified-audio build."
          EOF

      - name: Verify public player assets
        shell: bash
        run: |
          set -euo pipefail
          BUST="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          INDEX="$(curl -fsSL --retry 3 --retry-delay 2 "https://www.northerndial.ca/?deploy=${BUST}")"
          SHELL="$(curl -fsSL --retry 3 --retry-delay 2 "https://www.northerndial.ca/nd-shell.js?deploy=${BUST}")"
          HOME="$(curl -fsSL --retry 3 --retry-delay 2 "https://www.northerndial.ca/homepage.js?deploy=${BUST}")"
          grep -Fq "homepage.js?v=20260927e" <<<"$INDEX"
          grep -Fq "nd-shell.css?v=20260927e" <<<"$INDEX"
          grep -Fq "nd-shell.js?v=20260927e" <<<"$INDEX"
          grep -Fq "window.NDPlayer" <<<"$SHELL"
          grep -Fq "persistentController" <<<"$HOME"
          echo "Public site is serving the unified-audio build."
