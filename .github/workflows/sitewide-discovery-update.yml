name: Apply sitewide Discovery update

on:
  push:
    paths:
      - 'sitewide_discovery_update.py'
      - 'navigation_finalize.py'
      - 'site_quality_update.py'
      - 'scripts/site_quality_audit_v2.py'
      - 'accessibility_enhancements.js'
      - '.github/workflows/sitewide-discovery-update.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sitewide-discovery-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply responsive site navigation
        run: python3 sitewide_discovery_update.py

      - name: Finalize public navigation
        run: python3 navigation_finalize.py

      - name: Apply SEO, accessibility and indexing hardening
        run: python3 site_quality_update.py

      - name: Run site quality audit
        run: python3 scripts/site_quality_audit_v2.py

      - name: Commit site-wide changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html homepage_language.js accessibility_enhancements.js library.html artists.html discover.html requests.html blog/*.html about.html sessions.html archive.html accessibility.html rights.html survey.html fr sitemap.xml robots.txt 404.html admin.html instagram-dashboard.html library_artist_profiles.html sample-explorer.html zen-scene.html scripts/site_quality_audit_v2.py artist_removals.txt artist_unresolved.txt
          if git diff --cached --quiet; then
            echo 'No site-wide changes to commit.'
            exit 0
          fi
          git commit -m 'Harden SEO accessibility and site architecture'

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}..."
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo 'Unable to push site-wide update after 5 attempts.' >&2
          exit 1
