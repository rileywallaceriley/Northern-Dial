name: Normalize artist back links

on:
  push:
    paths:
      - 'artists.html'
      - 'artists/**'
      - 'normalize_artist_back_links.py'
      - '.github/workflows/normalize-artist-back-links.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-artist-back-links
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Normalize directory return links
        run: python3 normalize_artist_back_links.py

      - name: Commit normalized profile links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artists/
          if git diff --cached --quiet; then
            echo 'No artist back-link changes to commit.'
            exit 0
          fi
          git commit -m 'Normalize artist directory return links'
          git pull --rebase origin main
          git push
