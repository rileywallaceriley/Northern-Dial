name: Mobile build checks
on:
  push:
    branches: ['mobile/**']
    paths: ['mobile/**', '.github/workflows/mobile-build.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: mobile/package-lock.json}
      - run: npm ci && npm test && npm run build
        working-directory: mobile
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v3
      - run: npm ci && npm run sync
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: northern-dial-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci && npm run sync
        working-directory: mobile
      - run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile/ios/App
