name: Pin featured blog story

on:
  push:
    paths:
      - '.github/workflows/pin-featured-blog-story.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin-featured:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Pin featured story before dated posts
        run: python tools/pin_featured_blog_story.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nd-shell.js
          git diff --cached --quiet && exit 0
          git commit -m "Keep featured story above newer posts"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
