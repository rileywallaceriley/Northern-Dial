name: Import approved Northern Dial editorial artwork
on:
  push:
    branches:
      - editorial/nov-2026-three-features
    paths:
      - .nd-import-assets-trigger
permissions:
  contents: write
jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact approved artwork
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --output /tmp/nd-approved-art.zip 'https://drive.google.com/uc?export=download&id=1VIMQBlM1Omd97qx8bFhIeEUr9wc5uxRA'
          echo '6c8874ebb2ac00549e789fb4caacfa05bf2460a3cdaf903d1a1c4e3fc770641f  /tmp/nd-approved-art.zip' | sha256sum --check
      - name: Import only three expected artwork files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          expected = {
            'images/jessie-reyez-time-away-collage.png': '852a22b31ccdc9a75602e8964add9dfbcfae0e64744f52e59d92572865d0b02d',
            'images/new-canadian-music-october-30-collage.jpg': 'ff078d580ef558e14e3e7dc27f283050868a43b5728c12ce3fe9b3b856c85853',
            'images/october-records-collage-original.jpg': 'ae4d7572325a78a959329eb8d9640f51c149e318f66cddebd2cc6f8a940f64ee',
          }
          with zipfile.ZipFile('/tmp/nd-approved-art.zip') as bundle:
              if set(bundle.namelist()) != set(expected):
                  raise SystemExit('Unexpected artwork package contents')
              for name, digest in expected.items():
                  content=bundle.read(name)
                  if hashlib.sha256(content).hexdigest()!=digest:
                      raise SystemExit(f'Image checksum mismatch: {name}')
                  path=Path(name)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(content)
                  print('Imported unchanged:',name,len(content))
          PY
      - name: Commit verified images to publication branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Northern Dial Editorial Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add images/jessie-reyez-time-away-collage.png images/new-canadian-music-october-30-collage.jpg images/october-records-collage-original.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add approved November editorial artwork without alteration"
            git push origin HEAD
          fi
