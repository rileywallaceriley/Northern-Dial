name: Verify November 2026 Northern Dial publication live
on:
  push:
    branches: [ops/verify-nov-2026-publication]
    paths: [.github/workflows/nd-verify-live-publication.yml]
permissions:
  contents: write
jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify public pages and unmodified artwork
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, hashlib, time
          from pathlib import Path
          base="https://www.northerndial.ca"
          pages={
            "/blog/jessie-reyez-more-music-time-away.html":"Jessie Reyez Has More Music Coming.",
            "/blog/new-canadian-music-week-october-30-2026.html":"New Canadian Music This Week",
            "/blog/seven-canadian-records-missed-october-2026.html":"7 Canadian Records You Might Have Missed",
            "/blog/":"jessie-reyez-more-music-time-away.html",
            "/sitemap.xml":"seven-canadian-records-missed-october-2026.html",
          }
          images={
            "/images/jessie-reyez-time-away-collage.png":"852a22b31ccdc9a75602e8964add9dfbcfae0e64744f52e59d92572865d0b02d",
            "/images/new-canadian-music-october-30-collage.jpg":"ff078d580ef558e14e3e7dc27f283050868a43b5728c12ce3fe9b3b856c85853",
            "/images/october-records-collage-original.jpg":"ae4d7572325a78a959329eb8d9640f51c149e318f66cddebd2cc6f8a940f64ee",
          }
          result={}
          for attempt in range(1,13):
            result={}
            for path,needle in pages.items():
              url=base+path+("?nd_verify=20261101" if "?" not in path else "&nd_verify=20261101")
              try:
                req=urllib.request.Request(url,headers={"User-Agent":"NorthernDialPublicationQA/1.0","Cache-Control":"no-cache"})
                with urllib.request.urlopen(req,timeout=25) as response:
                  data=response.read()
                  final=response.geturl()
                  body=data.decode("utf-8","replace")
                  ok=response.status==200 and needle in body
                  result[path]=f'{"PASS" if ok else "FAIL"} HTTP={response.status} bytes={len(data)} expected_text={needle!r} final={final}'
              except Exception as e:
                result[path]=f'FAIL {type(e).__name__}: {str(e)[:220]}'
            for path,expected in images.items():
              try:
                req=urllib.request.Request(base+path+"?nd_verify=20261101",headers={"User-Agent":"NorthernDialPublicationQA/1.0","Cache-Control":"no-cache"})
                with urllib.request.urlopen(req,timeout=25) as response:
                  data=response.read()
                  sha=hashlib.sha256(data).hexdigest()
                  ok=response.status==200 and sha==expected
                  result[path]=f'{"PASS" if ok else "FAIL"} HTTP={response.status} bytes={len(data)} sha256={sha} expected={expected}'
              except Exception as e:
                result[path]=f'FAIL {type(e).__name__}: {str(e)[:220]}'
            print(f'Attempt {attempt}: {sum(x.startswith("PASS") for x in result.values())}/{len(result)} passed',flush=True)
            if all(x.startswith("PASS") for x in result.values()):
              break
            if attempt<12: time.sleep(18)
          passed=all(x.startswith("PASS") for x in result.values())
          lines=['LIVE PUBLICATION CHECK — 2026-11-01','RESULT: '+('PASS' if passed else 'NOT YET VERIFIED'),'Checked using GitHub-hosted runner, bypassing old search crawl caches','']+[f'{path}: {v}' for path,v in result.items()]
          Path('nd-publication-verify.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines),flush=True)
          PY
      - name: Save independent verification results on this ops branch only
        shell: bash
        run: |
          git config user.name "Northern Dial Publishing QA"
          git config user.email "actions@users.noreply.github.com"
          git add nd-publication-verify.txt
          git commit -m "Record public site deployment and approved image checksum verification" || exit 0
          git push origin HEAD
