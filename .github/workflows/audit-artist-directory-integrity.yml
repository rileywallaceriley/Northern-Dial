name: Audit artist directory integrity

on:
  push:
    paths:
      - 'artists.html'
      - 'artists/**'
      - 'artist_enrichment_batches/**'
      - 'artist_profiles.json'
      - 'build_artist_pages.py'
      - 'patch_directory_enrichment.py'
      - 'audit_artist_directory_integrity.py'
      - '.github/workflows/audit-artist-directory-integrity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artist-directory-integrity
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit profile and directory contracts
        id: integrity
        continue-on-error: true
        run: python3 audit_artist_directory_integrity.py

      - name: Publish integrity report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artist_directory_integrity_audit.json
          if git diff --cached --quiet; then
            echo 'No integrity report changes to commit.'
          else
            git commit -m 'Update artist directory integrity audit'
            git pull --rebase origin main
            git push
          fi

      - name: Enforce integrity result
        if: steps.integrity.outcome != 'success'
        run: |
          echo 'Artist directory integrity defects remain. See artist_directory_integrity_audit.json.' >&2
          exit 1

# Integrity recheck after normalize_artist_back_links.py rollout on 2026-09-10.
