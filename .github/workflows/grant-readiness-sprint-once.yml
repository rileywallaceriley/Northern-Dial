          grant_package = r'''# Northern Dial Grant Development Package

**Status:** working grant-development document, September 2026  
**Applicant approach for now:** Riley Wallace as the individual project lead/applicant where the program permits an individual artist or arts worker. Northern Dial is the project, not currently represented here as a separate incorporated nonprofit.

## 1. Core project statement
Northern Dial is an independent Canadian music discovery, documentation and radio project. It combines 24/7 curated programming, a source-backed artist library, editorial storytelling and listener-facing digital discovery tools to make Canadian music easier to find, understand and share, particularly independent, emerging, regional and under-documented work.

## 2. Public mandate
**Discovery. Documentation. Dissemination.**
- Discovery: connect audiences with Canadian artists through radio, requests, search and recommendation tools.
- Documentation: create and maintain source-backed profiles, geographic context and reliable artist metadata.
- Dissemination: extend Canadian music through radio, editorial work, searchable pages and future presentation/documentation programs.

## 3. Applicant and delivery structure
### Project lead
**Riley Wallace — Founder, editor and project lead.** Responsible for overall direction, editorial standards, programming, product strategy, research coordination, grant delivery and reporting.

### Collaborator roles
Northern Dial is Riley-led and collaborator-supported. Named individuals may vary by project and funding level; applications can identify confirmed contributors when required.
- **Development collaborator(s):** web development, integrations, automation, data workflows, QA and technical delivery.
- **Partnerships and development collaborator(s):** outreach, sponsorship/revenue development, stakeholder relationships, venue or organizational partnerships and audience growth.
- **Design and curation collaborator(s):** visual design, user experience, programming support, editorial curation and cultural/contextual review.
- **Specialist contractors as funded:** accessibility testing, professional French translation/comparative editing, rights research, production, documentation and evaluation.

Do not imply that unnamed collaborators are employees, formal board members or confirmed paid contractors unless that is true for the specific application.

## 4. Priority project streams
### A. Canadian Artist Library and Discovery
Build structured, source-backed discovery infrastructure around the existing Canadian catalogue. Priorities include profile completion, genre/era/place metadata, source provenance, bilingual core interfaces, accessibility and audience evaluation.

### B. Northern Dial Sessions
A proposed live/virtual presentation program for Canadian artists, combining intimate performance, artist conversation and accessible documentation. This is currently a program in development, not an announced funded season.

### C. Canadian Music Archive and Atlas
A longer-term digital cultural project exploring Canadian music through place, era, scene, artists, releases, stories and oral history. The existing library is a foundation, not yet a formal preservation archive.

## 5. Objectives
1. Increase meaningful discovery of Canadian artists beyond mainstream recommendation loops.
2. Improve the reliability and public usefulness of Canadian artist information through human review and source provenance.
3. Build accessible, bilingual-ready digital infrastructure that can support future cultural and presentation projects.
4. Strengthen pathways between listeners, artists, regional scenes and Canadian music communities.
5. Establish measurable evidence of audience use, discovery and project impact.

## 6. Outputs
Possible funded outputs, selected by program scope:
- verified/enriched artist profiles and structured discovery metadata
- public search/recommendation improvements
- bilingual core interfaces and professionally reviewed translation for funded deliverables
- accessibility testing and remediation
- rights/provenance and correction workflows
- listener/artist audience research
- editorial features, interviews or regional scene documentation
- live/virtual sessions and documented media, where presentation funding applies
- evaluation report and reusable project documentation

## 7. Intended outcomes
**Short term:** more Canadian artists become discoverable; catalogue reliability improves; audience behaviour becomes measurable; bilingual and accessibility foundations become stronger.

**Medium term:** listeners use Northern Dial as a recurring Canadian music discovery resource; artists gain additional contextual pathways to audiences; project partnerships and contributors expand.

**Long term:** Northern Dial develops into durable public digital infrastructure for Canadian music discovery and documentation, with the capacity to support deeper archival, regional and presentation projects.

## 8. Target audiences
- listeners seeking Canadian music outside mainstream algorithmic recommendations
- independent, emerging, regional and under-documented Canadian artists
- local music communities, curators and cultural organizations
- music journalists, researchers and educators seeking source-backed starting points
- French-speaking and bilingual Canadian audiences as the French rollout expands

## 9. Audience research plan
Use the bilingual Northern Dial pilot survey to establish baseline evidence on audience type, geography, frequency of use, artist discovery, feature value and desired improvements. Supplement with privacy-respecting web analytics and station/listener data where available.

Core evaluation questions:
- Did the user discover an artist they did not previously know?
- Which Northern Dial feature created that discovery?
- Where is the audience located?
- Do users return?
- What do artists and listeners say is missing from existing Canadian discovery tools?

## 10. Rights and provenance
Northern Dial maintains a public Rights, Sources and Corrections policy. Artist biographies and metadata should retain source references where practical. Ambiguous identities remain unresolved instead of being guessed. Third-party music, images and artist identities remain subject to the applicable rights holders. Funded archival/documentation work should include project-specific rights review and permissions where required.

## 11. Bilingual delivery
Northern Dial now has a French beta for core institutional pages and a bilingual audience survey. The current artist catalogue and legacy editorial archive are not represented as fully translated. For a funded bilingual deliverable, budget for professional French translation and comparative editing rather than treating automated translation as final publication.

## 12. Accessibility delivery
Northern Dial has a public accessibility commitment, a manual testing checklist and a read-only automated HTML accessibility guardrail. These are development practices, not WCAG certification. Larger funded projects should budget for specialist review and user testing appropriate to the grant requirements.

## 13. Illustrative 12-month schedule
**Months 1–2:** project setup, baseline metrics, audience research, technical/accessibility audit, rights review.  
**Months 3–5:** metadata/profile work, interface development, bilingual architecture, design and testing.  
**Months 6–8:** public beta/release, editorial or presentation production where applicable, audience recruitment.  
**Months 9–10:** accessibility remediation, translation review, partner/community feedback.  
**Months 11–12:** evaluation, final documentation, reporting and next-stage roadmap.

## 14. Budget framework
Use real quotes/rates for each application. Typical categories:
- project lead/editorial and project management
- development and technical implementation
- artist fees, where performances/interviews are funded
- design and user experience
- research, rights and metadata work
- professional French translation and comparative editing
- accessibility specialist/testing
- venue, production, recording or documentation costs where relevant
- hosting/software/services
- outreach, audience research and evaluation
- contingency where permitted

Track in-kind Riley time separately when a program allows it. Do not inflate volunteer/in-kind amounts simply to improve leverage.

## 15. Risks and mitigations
- **Founder concentration:** document workflows, use collaborator roles and scope projects to realistic capacity.
- **Rights uncertainty:** retain provenance, separate third-party content from open-source code and maintain correction/takedown procedures.
- **Translation quality:** use professional review for funded bilingual deliverables.
- **Accessibility gaps:** combine automated checks with manual and specialist testing.
- **Data quality:** keep unresolved cases unresolved, audit removals and preserve sources.
- **Audience claims:** distinguish measured results from projections.

## 16. Evidence inventory
Already available or in progress:
- live 24/7 station
- curated requestable catalogue
- artist library and enrichment audit
- editorial features
- Northern Dial Discovery
- source/removal workflow
- public About, Accessibility and Rights pages
- French core-site beta
- bilingual pilot audience survey
- public code repository

## 17. Application language to reuse
**One sentence:** Northern Dial is building public digital infrastructure for Canadian music discovery, documentation and audience connection.

**Short paragraph:** Northern Dial combines curated 24/7 radio, a source-backed Canadian artist library, editorial storytelling and digital discovery tools to help audiences find artists beyond the handful of names that dominate mainstream recommendation systems. The project is Riley-led and collaborator-supported, with a growing focus on bilingual access, accessibility, rights provenance and measurable public impact.

## 18. Items intentionally deferred
- incorporation/nonprofit restructuring
- formal board/governance structure
- dedicated project bank account and full financial system
- formal partnership commitments and letters of support

These should be revisited when a target program requires them rather than represented as already complete.
'''
