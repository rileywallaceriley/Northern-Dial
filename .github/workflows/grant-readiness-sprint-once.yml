name: Grant readiness sprint one-time update

on:
  push:
    paths:
      - '.github/workflows/grant-readiness-sprint-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build grant-readiness assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          RED = '#CC3333'
          LOGO = 'https://i.imgur.com/XIAPd0N.png'

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content.strip() + '\n', encoding='utf-8')

          base_css = r'''
          *{box-sizing:border-box}html{background:#fff}body{margin:0;background:linear-gradient(180deg,#fff 0%,#fff 72%,#f7e5e5 100%);color:#1a1a1a;font-family:"Roboto Condensed",sans-serif;min-height:100vh}a{color:inherit}.header{background:#fff;border-bottom:4px solid #C33}.header-inner{display:flex;justify-content:center;padding:12px 18px}.brand img{display:block;height:76px;width:auto}.page-nav{background:#1a1a1a;border-bottom:2px solid #C33;display:flex;justify-content:center}.page-nav a{color:#fff;font-family:"Oswald",sans-serif;font-size:.88rem;letter-spacing:.09em;padding:13px 16px;text-decoration:none;text-transform:uppercase}.page-nav a:hover,.page-nav a:focus,.page-nav a.active{background:#272727;color:#C33}.mobile-menu-toggle{display:none}.mobile-menu-links{display:flex;justify-content:center}.wrap{max-width:1060px;margin:0 auto;padding:38px 18px 72px}.hero{background:linear-gradient(135deg,#151515,#2a2a2a);border:5px solid #C33;border-radius:14px;color:#fff;padding:42px}.eyebrow{color:#C33;font-family:"Oswald",sans-serif;font-size:.84rem;font-weight:700;letter-spacing:.16em;margin-bottom:8px;text-transform:uppercase}h1,h2,h3,p{margin-top:0}h1{font-family:"Bebas Neue",sans-serif;font-size:clamp(3.2rem,8vw,5.8rem);font-weight:400;letter-spacing:.03em;line-height:.95;margin-bottom:16px;text-transform:uppercase}.hero p{color:#e5e5e5;font-size:1.13rem;line-height:1.65;margin:0;max-width:800px}.section{margin-top:30px}.card{background:#fff;border:4px solid #1a1a1a;border-radius:12px;padding:28px}.section h2{color:#C33;font-family:"Bebas Neue",sans-serif;font-size:2.5rem;font-weight:400;letter-spacing:.05em;margin-bottom:12px;text-transform:uppercase}.section h3{font-family:"Oswald",sans-serif;font-size:1.08rem;letter-spacing:.04em;margin-bottom:7px;text-transform:uppercase}.section p,.section li,.section label{font-size:1.02rem;line-height:1.65}.grid{display:grid;gap:16px;grid-template-columns:repeat(2,1fr)}.mini{background:#fff;border:3px solid #1a1a1a;border-radius:10px;padding:21px}.mini p{color:#555;margin:0}.btn{border-radius:7px;display:inline-block;font-family:"Oswald",sans-serif;font-size:.86rem;font-weight:700;letter-spacing:.09em;padding:11px 16px;text-decoration:none;text-transform:uppercase}.btn-red{background:#C33;border:2px solid #C33;color:#fff}.btn-outline{background:#fff;border:2px solid #1a1a1a;color:#1a1a1a}.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.note{background:#f8eded;border-left:5px solid #C33;padding:15px 17px}.footer{border-top:3px solid #1a1a1a;margin-top:46px;padding-top:20px}.footer a{color:#8B2323;font-weight:700;margin-right:14px}.small{color:#666;font-size:.9rem;line-height:1.5;margin-top:14px}.lang{background:#fff!important;color:#1a1a1a!important;border:2px solid #C33!important;border-radius:999px!important;margin:7px 6px;padding:5px 10px!important}.lang:hover,.lang:focus{background:#C33!important;color:#fff!important}
          @media(max-width:760px){.grid{grid-template-columns:1fr}.page-nav{display:block;position:sticky;top:0;z-index:1000}.mobile-menu-toggle{align-items:center;background:#1a1a1a;border:0;color:#fff;display:flex;font-family:"Oswald",sans-serif;font-size:.88rem;font-weight:700;justify-content:space-between;letter-spacing:.14em;min-height:48px;padding:13px 18px;text-transform:uppercase;width:100%}.mobile-menu-icon{color:#C33;font-family:Arial,sans-serif;font-size:1.35rem}.mobile-menu-links{background:#1a1a1a;display:none;flex-direction:column}.page-nav.menu-open .mobile-menu-links{display:flex}.mobile-menu-links a{border-bottom:1px solid #343434;padding:14px 18px;text-align:left}.mobile-menu-links .submit-link{background:#C33;color:#fff}.lang{align-self:flex-start;margin:8px 18px!important}.wrap{padding:26px 12px 56px}.hero{padding:30px 23px}.brand img{height:62px}}
          @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
          '''

          nav_script = """<script>const nav=document.querySelector('.page-nav'),toggle=document.querySelector('.mobile-menu-toggle');if(nav&&toggle){toggle.addEventListener('click',()=>{const o=nav.classList.toggle('menu-open');toggle.setAttribute('aria-expanded',String(o));toggle.querySelector('.mobile-menu-icon').textContent=o?'✕':'☰'})}</script>"""

          def en_nav(active='', fr='/fr/'):
              items=[('index.html','Home'),('library.html','Songs'),('artists.html','Artists'),('discover.html','Discover'),('blog/','Blog'),('about.html','About')]
              links=''.join(f'<a href="{href}"'+(' class="active" aria-current="page"' if label==active else '')+f'>{label}</a>' for href,label in items)
              return f'''<nav class="page-nav" aria-label="Main navigation"><button class="mobile-menu-toggle" type="button" aria-expanded="false" aria-label="Open navigation menu"><span>Menu</span><span class="mobile-menu-icon" aria-hidden="true">☰</span></button><div class="mobile-menu-links">{links}<a class="lang" href="{fr}" lang="fr" hreflang="fr">FR</a><a href="index.html#submit" class="submit-link">Submit</a></div></nav>'''

          def fr_nav(active='', en='/'):
              items=[('/fr/','Accueil'),('/fr/a-propos.html','À propos'),('/fr/droits.html','Droits'),('/fr/accessibilite.html','Accessibilité'),('/survey.html','Sondage')]
              links=''.join(f'<a href="{href}"'+(' class="active" aria-current="page"' if label==active else '')+f'>{label}</a>' for href,label in items)
              return f'''<nav class="page-nav" aria-label="Navigation principale"><button class="mobile-menu-toggle" type="button" aria-expanded="false" aria-label="Ouvrir le menu de navigation"><span>Menu</span><span class="mobile-menu-icon" aria-hidden="true">☰</span></button><div class="mobile-menu-links">{links}<a class="lang" href="{en}" lang="en" hreflang="en">EN</a></div></nav>'''

          def shell(lang, title, description, canonical, nav, body, alternates=''):
              return f'''<!DOCTYPE html>
<html lang="{lang}">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="{description}"><meta name="theme-color" content="#CC3333"><link rel="canonical" href="{canonical}">{alternates}<title>{title}</title><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet"><style>{base_css}</style>
</head><body><header class="header"><div class="header-inner"><a class="brand" href="{'/fr/' if lang=='fr' else '/'}" aria-label="Northern Dial"><img src="{LOGO}" alt="Northern Dial"></a></div>{nav}</header><main class="wrap">{body}</main>{nav_script}</body></html>'''

          rights_body = '''
          <section class="hero"><div class="eyebrow">Rights, Sources and Corrections</div><h1>Respect the Work. Show the Source.</h1><p>Northern Dial documents and promotes Canadian music. That means being clear about where information comes from, what we own, what we do not own and how artists or rights holders can ask us to correct or remove material.</p></section>
          <section class="section card"><div class="eyebrow">Provenance</div><h2>Source-Backed Artist Information</h2><p>Artist biographies and metadata are built from official artist websites, label or management pages, established publications, public databases and other reliable sources. Where practical, Northern Dial keeps source references with profile data so claims can be checked later. Ambiguous identities or Canadian connections stay unresolved rather than being presented as fact.</p></section>
          <section class="section"><div class="eyebrow">Rights</div><h2>What Northern Dial Does and Does Not Claim</h2><div class="grid"><div class="mini"><h3>Artist Names and Facts</h3><p>Names, career facts and other factual information are used for editorial and discovery purposes. Northern Dial does not claim ownership over an artist's identity or factual history.</p></div><div class="mini"><h3>Images</h3><p>Artist images may come from artist-supplied materials, official pages or other sources believed appropriate for editorial identification. Rights remain with their respective owners.</p></div><div class="mini"><h3>Music and Audio</h3><p>Streaming and request functionality is handled through Northern Dial's radio infrastructure. Copyright in recordings and compositions remains with the applicable artists, writers, labels, publishers and other rights holders.</p></div><div class="mini"><h3>Original Northern Dial Work</h3><p>Original editorial writing, interface design and project-specific materials remain subject to their own authorship and licensing terms. The public code repository does not automatically place third-party content into the same licence.</p></div></div></section>
          <section class="section card"><div class="eyebrow">Corrections and Takedowns</div><h2>Artists Can Challenge the Record</h2><p>If an artist, representative or rights holder believes a profile contains an error, misidentification, inappropriate image or material that should be removed, Northern Dial will review the request and the supporting information. Corrections should favour verifiable evidence, and clear rights concerns should be handled promptly.</p><div class="note"><strong>Current contact path:</strong> public factual corrections can be raised through the Northern Dial GitHub repository. For matters involving private information or rights documentation, do not post sensitive material publicly. A dedicated private rights inbox is a planned operational improvement.</div><div class="links"><a class="btn btn-red" href="https://github.com/rileywallaceriley/Northern-Dial" target="_blank" rel="noopener">GitHub Repository</a><a class="btn btn-outline" href="about.html#curation">How We Curate</a></div></section>
          <section class="section"><div class="eyebrow">Artist-Submitted Material</div><h2>Submission Is Not a Rights Transfer</h2><p>Submitting music or information to Northern Dial does not transfer ownership of the underlying work. Submitters should only provide materials they are authorized to share. Northern Dial may use submitted information to evaluate music for programming, editorial coverage or inclusion in public discovery features.</p></section>
          <footer class="footer"><a href="about.html">About</a><a href="accessibility.html">Accessibility</a><a href="survey.html">Audience Survey</a><p class="small">Last updated September 2026. This page describes Northern Dial's editorial operating approach and is not legal advice.</p></footer>'''
          write('rights.html', shell('en','Rights, Sources and Corrections | Northern Dial','Northern Dial rights, sourcing, corrections and provenance policy.','https://www.northerndial.ca/rights.html',en_nav(fr='/fr/droits.html'),rights_body,'<link rel="alternate" hreflang="fr" href="https://www.northerndial.ca/fr/droits.html"><link rel="alternate" hreflang="en" href="https://www.northerndial.ca/rights.html">'))

          survey_body = '''
          <section class="hero"><div class="eyebrow">Audience Research · Recherche auprès du public</div><h1>Help Shape Northern Dial</h1><p>Tell us how you use Northern Dial and what would make Canadian music discovery more useful to you. This short pilot survey is available in English and French.</p></section>
          <section class="section card"><div class="eyebrow">Pilot Survey</div><h2>Your Experience / Votre expérience</h2>
          <form id="surveyForm">
            <p><label for="language"><strong>Response language / Langue de réponse</strong></label><br><select id="language" name="language"><option>English</option><option>Français</option></select></p>
            <p><label for="role"><strong>Which best describes you? / Quel profil vous décrit le mieux?</strong></label><br><select id="role" name="role"><option>Listener / Auditeur·rice</option><option>Artist / Artiste</option><option>Music industry / Industrie musicale</option><option>Researcher or journalist / Recherche ou journalisme</option><option>Other / Autre</option></select></p>
            <p><label for="region"><strong>Province, territory or region / Province, territoire ou région</strong></label><br><input id="region" name="region" type="text"></p>
            <p><label for="frequency"><strong>How often do you use Northern Dial? / À quelle fréquence utilisez-vous Northern Dial?</strong></label><br><select id="frequency" name="frequency"><option>First visit / Première visite</option><option>Occasionally / À l'occasion</option><option>Monthly / Chaque mois</option><option>Weekly / Chaque semaine</option><option>Several times a week / Plusieurs fois par semaine</option></select></p>
            <p><label for="discovery"><strong>Have you discovered a Canadian artist here you did not already know? / Avez-vous découvert ici un artiste canadien que vous ne connaissiez pas?</strong></label><br><select id="discovery" name="discovery"><option>Yes / Oui</option><option>No / Non</option><option>Not yet / Pas encore</option></select></p>
            <p><label for="valuable"><strong>What is most useful? / Qu'est-ce qui vous est le plus utile?</strong></label><br><select id="valuable" name="valuable"><option>Live radio / Radio en direct</option><option>Artist library / Répertoire d'artistes</option><option>Discovery tool / Outil de découverte</option><option>Editorial stories / Articles</option><option>Requests / Demandes</option></select></p>
            <p><label for="next"><strong>What should Northern Dial build or improve next? / Que devrait développer ou améliorer Northern Dial?</strong></label><br><textarea id="next" name="next" rows="4"></textarea></p>
            <p><label for="comment"><strong>Anything else? / Autre chose?</strong></label><br><textarea id="comment" name="comment" rows="4"></textarea></p>
            <p><label><input type="checkbox" name="quote" value="yes"> You may quote my response anonymously in funding or project reporting. / Vous pouvez citer ma réponse de façon anonyme dans les demandes de financement ou les rapports.</label></p>
            <div class="links"><button class="btn btn-red" type="button" id="copySurvey">Copy Response / Copier</button><button class="btn btn-outline" type="button" id="shareSurvey">Share Response / Partager</button></div>
          </form><div id="surveyStatus" class="note" style="margin-top:18px" aria-live="polite">Pilot collection method: responses are copied or shared from your device. Northern Dial does not yet store survey responses in a centralized database. / Méthode pilote : les réponses sont copiées ou partagées depuis votre appareil. Northern Dial ne les stocke pas encore dans une base de données centralisée.</div></section>
          <footer class="footer"><a href="about.html">About</a><a href="rights.html">Rights and Sources</a><a href="/fr/">Français</a></footer>
          <style>form input[type=text],form select,form textarea{width:100%;max-width:760px;border:2px solid #1a1a1a;border-radius:6px;padding:10px;font:inherit;background:#fff}form button{cursor:pointer}</style>
          <script>
          function surveyText(){const f=new FormData(document.getElementById('surveyForm'));return 'Northern Dial Audience Survey / Sondage Northern Dial\n\n'+[...f.entries()].map(([k,v])=>k+': '+v).join('\n')}
          document.getElementById('copySurvey').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(surveyText());document.getElementById('surveyStatus').textContent='Response copied. / Réponse copiée.'}catch(e){document.getElementById('surveyStatus').textContent='Copy failed. Please select and copy your answers manually. / La copie a échoué.'}});
          document.getElementById('shareSurvey').addEventListener('click',async()=>{const text=surveyText();if(navigator.share){try{await navigator.share({title:'Northern Dial Audience Survey',text})}catch(e){}}else{try{await navigator.clipboard.writeText(text);document.getElementById('surveyStatus').textContent='Sharing is not available here, so the response was copied. / Le partage n’est pas disponible; la réponse a été copiée.'}catch(e){}}});
          </script>'''
          write('survey.html', shell('en','Audience Survey | Northern Dial','Northern Dial bilingual listener and artist audience survey.','https://www.northerndial.ca/survey.html',en_nav(fr='/survey.html'),survey_body))

          fr_home_body='''
          <section class="hero"><div class="eyebrow">Northern Dial en français</div><h1>La musique canadienne mérite du contexte</h1><p>Northern Dial est un projet indépendant de radio, de découverte et de documentation de la musique canadienne. Cette version française donne accès aux pages essentielles du projet pendant que la traduction du catalogue et des articles se développe progressivement.</p><div class="links"><a class="btn btn-red" href="/">Écouter la radio</a><a class="btn btn-outline" href="/discover.html">Découvrir des artistes</a></div></section>
          <section class="section"><div class="eyebrow">Le projet</div><h2>Découverte. Documentation. Diffusion.</h2><div class="grid"><div class="mini"><h3>Radio canadienne 24/7</h3><p>Une programmation canadienne continue, avec des demandes d'auditeurs et une rotation qui traverse les genres et les époques.</p></div><div class="mini"><h3>Répertoire d'artistes</h3><p>Un catalogue croissant d'artistes canadiens enrichi de biographies, de lieux, de liens officiels et de sources.</p></div><div class="mini"><h3>Découverte Northern Dial</h3><p>Un outil qui utilise le catalogue sélectionné pour proposer cinq artistes canadiens selon vos goûts.</p></div><div class="mini"><h3>Histoires et communauté</h3><p>Des portraits d'artistes, des histoires régionales, des soumissions et des projets de programmation future.</p></div></div></section>
          <section class="section card"><div class="eyebrow">Version française en développement</div><h2>Une base bilingue, sans fausse promesse</h2><p>Les pages institutionnelles essentielles sont maintenant offertes en français. Le répertoire d'artistes et les articles de fond restent pour l'instant dans leur langue source jusqu'à ce qu'une traduction et une révision appropriées soient disponibles.</p><div class="links"><a class="btn btn-red" href="/fr/a-propos.html">À propos</a><a class="btn btn-outline" href="/fr/droits.html">Droits et sources</a><a class="btn btn-outline" href="/fr/accessibilite.html">Accessibilité</a><a class="btn btn-outline" href="/survey.html">Sondage bilingue</a></div></section>
          <footer class="footer"><a href="/">English</a><a href="/artists.html">Artistes</a><a href="/blog/">Articles</a><p class="small">Certaines ressources demeurent en anglais pendant le déploiement progressif de la version française.</p></footer>'''
          write('fr/index.html', shell('fr','Northern Dial en français | Musique canadienne','Northern Dial en français : radio, découverte et documentation de la musique canadienne.','https://www.northerndial.ca/fr/',fr_nav(active='Accueil'),fr_home_body,'<link rel="alternate" hreflang="en" href="https://www.northerndial.ca/"><link rel="alternate" hreflang="fr" href="https://www.northerndial.ca/fr/">'))

          fr_about_body='''
          <section class="hero"><div class="eyebrow">À propos de Northern Dial</div><h1>La musique canadienne mérite du contexte</h1><p>Northern Dial est un projet indépendant de découverte, de documentation et de radio consacré à la musique canadienne. La radio est la porte d'entrée; le projet plus large vise à bâtir une infrastructure publique utile autour des artistes, des scènes et des histoires musicales du Canada.</p></section>
          <section class="section card"><div class="eyebrow">Mandat</div><h2>Découverte. Documentation. Diffusion.</h2><p>Northern Dial cherche à rendre la musique canadienne plus facile à trouver, à comprendre et à partager, avec une attention particulière aux artistes indépendants, émergents, régionaux et moins documentés.</p></section>
          <section class="section"><div class="eyebrow">Direction du projet</div><h2>Un projet dirigé par Riley</h2><p><strong>Riley Wallace, fondateur et rédacteur en chef</strong>, dirige actuellement Northern Dial et assume la stratégie éditoriale, la programmation, le développement du produit et la coordination générale. Le projet est soutenu par des collaborateurs qui peuvent contribuer selon les besoins et les ressources disponibles.</p><div class="grid"><div class="mini"><h3>Développement</h3><p>Soutien au développement Web, aux intégrations, à l'automatisation, aux données et à l'évolution technique de la plateforme.</p></div><div class="mini"><h3>Partenariats et développement</h3><p>Soutien aux relations avec les partenaires, aux commandites, aux occasions de revenus et au développement de collaborations.</p></div><div class="mini"><h3>Design et curation</h3><p>Soutien à l'identité visuelle, à l'expérience utilisateur, à la programmation, à la sélection et au contexte éditorial.</p></div><div class="mini"><h3>Spécialistes futurs</h3><p>Les projets financés peuvent ajouter des spécialistes rémunérés en accessibilité, traduction, recherche, droits ou production selon le programme.</p></div></div></section>
          <section class="section card"><div class="eyebrow">Méthode</div><h2>Curation humaine et sources vérifiables</h2><p>Northern Dial ne traite pas chaque crédit de base de données comme un fait. Les identités et les liens canadiens sont vérifiés à partir de sources fiables; les cas ambigus restent non résolus plutôt que de devenir des suppositions.</p><div class="links"><a class="btn btn-red" href="/fr/droits.html">Droits et sources</a><a class="btn btn-outline" href="/survey.html">Participer au sondage</a></div></section>
          <footer class="footer"><a href="/about.html">English</a><a href="/fr/accessibilite.html">Accessibilité</a><a href="/fr/droits.html">Droits</a></footer>'''
          write('fr/a-propos.html', shell('fr','À propos | Northern Dial','À propos de Northern Dial, projet canadien de radio, découverte et documentation musicale.','https://www.northerndial.ca/fr/a-propos.html',fr_nav(active='À propos',en='/about.html'),fr_about_body,'<link rel="alternate" hreflang="en" href="https://www.northerndial.ca/about.html"><link rel="alternate" hreflang="fr" href="https://www.northerndial.ca/fr/a-propos.html">'))

          fr_rights_body='''
          <section class="hero"><div class="eyebrow">Droits, sources et corrections</div><h1>Respecter le travail. Montrer la source.</h1><p>Northern Dial documente et fait découvrir la musique canadienne. Nous voulons donc être clairs sur nos sources, sur ce que nous possédons ou non et sur la façon dont les artistes ou titulaires de droits peuvent demander une correction ou un retrait.</p></section>
          <section class="section card"><div class="eyebrow">Provenance</div><h2>Des profils appuyés par des sources</h2><p>Les biographies et métadonnées proviennent de sites officiels d'artistes, de maisons de disques ou de gestion, de publications reconnues, de bases publiques et d'autres sources fiables. Les cas ambigus restent non résolus jusqu'à ce que des preuves suffisantes soient disponibles.</p></section>
          <section class="section"><div class="eyebrow">Droits</div><h2>Ce que Northern Dial revendique, et ne revendique pas</h2><div class="grid"><div class="mini"><h3>Noms et faits</h3><p>Les noms et faits de carrière sont utilisés à des fins éditoriales et de découverte. Northern Dial ne revendique aucun droit de propriété sur l'identité ou l'histoire d'un artiste.</p></div><div class="mini"><h3>Images</h3><p>Les images peuvent provenir de matériel fourni par l'artiste, de pages officielles ou d'autres sources jugées appropriées pour l'identification éditoriale. Les droits demeurent à leurs propriétaires respectifs.</p></div><div class="mini"><h3>Musique et audio</h3><p>Les droits sur les enregistrements et compositions demeurent aux artistes, auteurs, maisons de disques, éditeurs et autres titulaires concernés.</p></div><div class="mini"><h3>Travail original</h3><p>Les textes, interfaces et éléments originaux de Northern Dial conservent leur propre statut d'auteur et de licence; le dépôt de code public n'étend pas automatiquement sa licence au contenu de tiers.</p></div></div></section>
          <section class="section card"><div class="eyebrow">Corrections et retraits</div><h2>Les artistes peuvent contester le dossier</h2><p>Une erreur, une mauvaise identification, une image inappropriée ou une préoccupation liée aux droits peut faire l'objet d'une révision. Les corrections doivent s'appuyer sur des éléments vérifiables. Pour l'instant, les corrections factuelles publiques peuvent être signalées sur GitHub. Il ne faut pas y publier de renseignements privés ou de documents sensibles.</p></section>
          <footer class="footer"><a href="/rights.html">English</a><a href="/fr/a-propos.html">À propos</a><a href="/fr/accessibilite.html">Accessibilité</a></footer>'''
          write('fr/droits.html', shell('fr','Droits, sources et corrections | Northern Dial','Politique de Northern Dial sur les droits, les sources, la provenance et les corrections.','https://www.northerndial.ca/fr/droits.html',fr_nav(active='Droits',en='/rights.html'),fr_rights_body,'<link rel="alternate" hreflang="en" href="https://www.northerndial.ca/rights.html"><link rel="alternate" hreflang="fr" href="https://www.northerndial.ca/fr/droits.html">'))

          fr_access_body='''
          <section class="hero"><div class="eyebrow">Accessibilité</div><h1>L'accès fait partie du produit</h1><p>Northern Dial veut rendre sa radio, son information sur les artistes, ses articles et ses outils de découverte utiles sur différents appareils, vitesses de connexion et modes d'accès.</p></section>
