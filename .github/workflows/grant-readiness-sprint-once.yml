          accessibility_checklist=r'''# Northern Dial Accessibility Testing Checklist

This checklist supports the public accessibility commitment. It is a development and QA process, not a certification of WCAG compliance.

## Before publishing or materially redesigning a page
- Confirm a descriptive `<title>`, one primary `<h1>` and a declared page language.
- Check heading order for understandable structure.
- Confirm meaningful images have useful `alt` text; decorative images should use empty alt text where appropriate.
- Navigate the page using keyboard only. Focus must remain visible and controls must be reachable in a logical order.
- Open and close mobile navigation using keyboard controls.
- Confirm buttons and form fields have understandable visible or programmatic labels.
- Check text and control contrast, including hover/focus/active states.
- Test at 200% browser zoom and at a narrow mobile width without losing core content.
- Respect `prefers-reduced-motion` for non-essential animation.
- Spot-check with a screen reader on core journeys: listen, navigate, discover, read artist information and complete forms.

## For audio, video and interviews
- Add captions for video dialogue and meaningful audio where applicable.
- Provide transcripts for interview/documentary material where practical.
- Do not rely on sound alone for important status or instructions.

## For funded projects
Budget for specialist review and, where feasible, testing with disabled users. Automated checks are a guardrail, not a substitute for lived-experience testing or a professional accessibility audit.
'''
          write('docs/accessibility/TESTING_CHECKLIST.md',accessibility_checklist)

          audit_py=r'''#!/usr/bin/env python3
from html.parser import HTMLParser
from pathlib import Path
import re, sys

class Audit(HTMLParser):
    def __init__(self):
        super().__init__(); self.html_lang=False; self.h1=0; self.images=[]; self.labels=set(); self.controls=[]; self.buttons=[]; self.stack=[]
    def handle_starttag(self, tag, attrs):
        a=dict(attrs); self.stack.append(tag)
        if tag=='html': self.html_lang=bool(a.get('lang'))
        if tag=='h1': self.h1+=1
        if tag=='img': self.images.append(a)
        if tag=='label' and a.get('for'): self.labels.add(a['for'])
        if tag in ('input','select','textarea'):
            if tag=='input' and a.get('type','text') in ('hidden','submit','button'): return
            self.controls.append((tag,a))
        if tag=='button': self.buttons.append({'attrs':a,'text':''})
    def handle_endtag(self, tag):
        if self.stack: self.stack.pop()
    def handle_data(self, data):
        if self.buttons and self.stack and self.stack[-1]=='button': self.buttons[-1]['text']+=data.strip()

def check(path):
    text=Path(path).read_text(encoding='utf-8',errors='replace'); p=Audit(); p.feed(text); errors=[]; warnings=[]
    if not p.html_lang: errors.append('missing html lang')
    if p.h1!=1: warnings.append(f'expected 1 h1, found {p.h1}')
    for i,img in enumerate(p.images,1):
        if 'alt' not in img: errors.append(f'image {i} missing alt')
    for tag,a in p.controls:
        cid=a.get('id'); labelled=bool(a.get('aria-label') or a.get('aria-labelledby') or (cid and cid in p.labels))
        if not labelled: warnings.append(f'{tag} control lacks explicit label: {cid or "no id"}')
    for i,b in enumerate(p.buttons,1):
        if not b['text'] and not b['attrs'].get('aria-label'): warnings.append(f'button {i} may lack accessible name')
    return errors,warnings

paths=sys.argv[1:] or ['index.html','about.html','rights.html','accessibility.html','survey.html','fr/index.html','fr/a-propos.html','fr/droits.html','fr/accessibilite.html']
failed=False
for path in paths:
    if not Path(path).exists(): print(f'WARN {path}: missing'); continue
    e,w=check(path)
    for x in e: print(f'ERROR {path}: {x}'); failed=True
    for x in w: print(f'WARN {path}: {x}')
if failed: sys.exit(1)
print('Accessibility guardrail completed.')
'''
