name: Fix featured mobile card
on:
  push:
    paths:
      - 'tools/fix_featured_mobile.py'
      - '.github/workflows/fix-featured-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fix mobile featured card
        run: python tools/fix_featured_mobile.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/index.html tools/refine_sep11_features.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix featured blog card on mobile"
            git push
          fi
