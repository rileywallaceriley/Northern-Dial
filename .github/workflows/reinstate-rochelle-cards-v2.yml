name: Reinstate Rochelle cards v2

on:
  push:
    paths:
      - 'tools/reinstate_rochelle_cards.py'
      - '.github/workflows/reinstate-rochelle-cards-v2.yml'

permissions:
  contents: write

jobs:
  reinstate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore Rochelle cards
        run: python tools/reinstate_rochelle_cards.py
      - name: Commit restored cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/index.html index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Restore Rochelle Jordan cards below current features'
          git pull --rebase origin main
          git push origin HEAD:main
