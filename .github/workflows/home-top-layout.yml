name: Homepage layout maintenance

on:
  push:
    paths:
      - '.github/workflows/home-top-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-top-layout
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move Explore Recent Songs below About
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          banner_pattern = re.compile(
              r'\n?<!-- Explore Recent Songs Banner -->\s*'
              r'<section id="library" style="margin-bottom: 60px;">.*?</section>\s*',
              re.S,
          )
          match = banner_pattern.search(text)
          if not match:
              raise SystemExit('Could not locate Explore Recent Songs banner')

          banner = match.group(0).strip()
          text = text[:match.start()] + '\n\n' + text[match.end():]

          shows_marker = '<section id="shows" class="shows-section">'
          if shows_marker not in text:
              raise SystemExit('Could not locate On Air Daily section')

          text = text.replace(
              shows_marker,
              banner + '\n\n' + shows_marker,
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage order
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage order changes to commit.'
            exit 0
          fi
          git commit -m 'Move songs banner below About section'
          git push origin HEAD:main
