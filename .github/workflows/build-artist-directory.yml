name: Build artist directory

on:
  push:
    paths:
      - 'artist_enrichment_batches/**'
      - 'artist_profiles.json'
      - 'artist_removals.txt'
      - 'build_artists.py'
      - 'build_artist_pages.py'
      - '.github/workflows/build-artist-directory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-artist-directory
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge reviewed enrichment batches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob
          import json

          enrichment_path = Path('artist_enrichment.json')
          manifest_path = Path('artist_publish_manifest.json')

          enrichment = json.loads(enrichment_path.read_text(encoding='utf-8')) if enrichment_path.exists() else {}
          published = set(json.loads(manifest_path.read_text(encoding='utf-8'))) if manifest_path.exists() else set()

          for filename in sorted(glob.glob('artist_enrichment_batches/*.json')):
              batch = json.loads(Path(filename).read_text(encoding='utf-8'))
              for key, value in batch.items():
                  normalized = str(key).casefold()
                  enrichment[normalized] = value
                  if value.get('reviewed'):
                      published.add(normalized)

          enrichment_path.write_text(json.dumps(enrichment, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          manifest_path.write_text(json.dumps(sorted(published), indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Build directory from live station catalogue
        continue-on-error: true
        run: python3 build_artists.py

      - name: Build standalone artist SEO pages
        run: python3 build_artist_pages.py

      - name: Link next 200 researched artists to standalone pages
        run: |
          python3 - <<'PY'
          from html import unescape
          from pathlib import Path
          import re
          from build_artist_pages import load_profiles, load_enrichments, slugify

          BATCH_SIZE = 200
          directory_path = Path('artists.html')
          html = directory_path.read_text(encoding='utf-8')
          profiles = load_profiles()
          enrichments = load_enrichments()

          researched = {}
          for key in sorted(set(profiles) | set(enrichments)):
              profile_name, profile = profiles.get(key, ('', {}))
              enrichment_name, enrichment = enrichments.get(key, ('', {}))
              if not profile and not enrichment.get('reviewed'):
                  continue
              name = profile_name or enrichment_name or key
              researched[str(key).casefold()] = slugify(name)

          summary_pattern = re.compile(
              r'<summary>(?P<label>.*?)\s*<span class="artist-meta">',
              re.IGNORECASE | re.DOTALL,
          )
          tag_pattern = re.compile(r'<[^>]+>')
          stats = {'added': 0, 'existing': 0, 'matched': 0}

          def replace_summary(match):
              label_html = match.group('label').strip()
              display_text = unescape(tag_pattern.sub('', label_html)).strip()
              key = display_text.casefold()
              slug = researched.get(key)
              if not slug:
                  return match.group(0)

              stats['matched'] += 1

              # Preserve links already added by earlier batches.
              if 'artist-page-link' in label_html:
                  stats['existing'] += 1
                  return match.group(0)

              # Add no more than 200 new links in this run.
              if stats['added'] >= BATCH_SIZE:
                  return match.group(0)

              stats['added'] += 1
              return (
                  f'<summary><a class="artist-page-link" href="./artists/{slug}.html" '
                  f'onclick="event.stopPropagation()">{label_html}</a> '
                  f'<span class="artist-meta">'
              )

          html = summary_pattern.sub(replace_summary, html)

          if '.artist-page-link {' not in html:
              style = '''\n    .artist-page-link { color: inherit; text-decoration: underline; text-decoration-color: #C33; text-underline-offset: 3px; }\n    .artist-page-link:hover, .artist-page-link:focus { color: #C33; }\n'''
              html = html.replace('</style>', style + '</style>', 1)

          directory_path.write_text(html, encoding='utf-8')
          remaining = max(0, stats['matched'] - stats['existing'] - stats['added'])
          print(
              f"Added {stats['added']} new artist links; "
              f"preserved {stats['existing']} existing links; "
              f"matched {stats['matched']} researched directory artists; "
              f"approximately {remaining} matched artists remain unlinked."
          )
          PY

      - name: Link discovery recommendations to artist profiles
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('discover.html')
          html = path.read_text(encoding='utf-8')

          normalize_line = '    const normalize=value=>String(value||"").toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/[’‘]/g,"\'").trim();'
          slug_line = '    const profileSlug=value=>String(value||"").normalize("NFKD").replace(/[\\u0300-\\u036f]/g,"").replace(/[^\\x00-\\x7F]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"artist";'
          if slug_line not in html:
              html = html.replace(normalize_line, normalize_line + '\n' + slug_line, 1)

          old_parse = 'feature=featureAnchor?.getAttribute("href")||"",signals=[bio,...tracks.slice(0,12).map(track=>track.album)].join(" ");artists.push({name,key,bio,location,tracks,requestHref,feature,genres:classifyGenres(signals),eras:inferEras(signals),image:imageMap.get(key)||""});'
          new_parse = 'feature=featureAnchor?.getAttribute("href")||"",existingProfile=details.querySelector("summary .artist-page-link")?.getAttribute("href")||"",profileHref=existingProfile||(bio?`./artists/${profileSlug(name)}.html`:""),signals=[bio,...tracks.slice(0,12).map(track=>track.album)].join(" ");artists.push({name,key,bio,location,tracks,requestHref,feature,profileHref,genres:classifyGenres(signals),eras:inferEras(signals),image:imageMap.get(key)||""});'
          html = html.replace(old_parse, new_parse, 1)

          old_render = 'const requestUrl=artist.requestHref||`./index.html?request=${encodeURIComponent(artist.name)}`,primaryUrl=artist.feature||requestUrl,tags='
          new_render = 'const requestUrl=artist.requestHref||`./index.html?request=${encodeURIComponent(artist.name)}`,profileUrl=artist.profileHref||"",primaryUrl=profileUrl||artist.feature||requestUrl,tags='
          html = html.replace(old_render, new_render, 1)

          old_actions = 'feature=artist.feature?`<a class="feature-link" href="${escapeAttr(artist.feature)}">Read Feature</a>`:"",bio=artist.bio||"Explore this Canadian artist in the Northern Dial catalogue.";'
          new_actions = 'profile=profileUrl?`<a class="feature-link" href="${escapeAttr(profileUrl)}">Artist Profile</a>`:"",feature=artist.feature?`<a class="feature-link" href="${escapeAttr(artist.feature)}">Read Feature</a>`:"",bio=artist.bio||"Explore this Canadian artist in the Northern Dial catalogue.";'
          html = html.replace(old_actions, new_actions, 1)

          old_buttons = '<div class="card-actions"><a class="request-link" href="${escapeAttr(requestUrl)}">Request ${escapeHtml(artist.name)}</a>${feature}</div>'
          new_buttons = '<div class="card-actions"><a class="request-link" href="${escapeAttr(requestUrl)}">Request ${escapeHtml(artist.name)}</a>${profile}${feature}</div>'
          html = html.replace(old_buttons, new_buttons, 1)

          path.write_text(html, encoding='utf-8')
          print('Discovery recommendations now prefer and expose standalone artist profile links.')
          PY

      - name: Keep enrichment batches as source of truth
        run: git checkout -- artist_enrichment.json artist_publish_manifest.json

      - name: Commit generated artist pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artists.html artists/ sitemap.xml discover.html
          if git diff --cached --quiet; then
            echo 'No artist page changes to commit.'
            exit 0
          fi
          git commit -m 'Rebuild artist directory and SEO pages'

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}..."
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo 'Unable to push generated artist pages after 5 attempts.' >&2
          exit 1

