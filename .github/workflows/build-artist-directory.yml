name: Build artist directory

on:
  push:
    paths:
      - 'artist_enrichment_batches/**'
      - 'artist_profiles.json'
      - 'artist_removals.txt'
      - 'build_artists.py'
      - 'build_artist_pages.py'
      - '.github/workflows/build-artist-directory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-artist-directory
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge reviewed enrichment batches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob
          import json

          enrichment_path = Path('artist_enrichment.json')
          manifest_path = Path('artist_publish_manifest.json')

          enrichment = json.loads(enrichment_path.read_text(encoding='utf-8')) if enrichment_path.exists() else {}
          published = set(json.loads(manifest_path.read_text(encoding='utf-8'))) if manifest_path.exists() else set()

          for filename in sorted(glob.glob('artist_enrichment_batches/*.json')):
              batch = json.loads(Path(filename).read_text(encoding='utf-8'))
              for key, value in batch.items():
                  normalized = str(key).casefold()
                  enrichment[normalized] = value
                  if value.get('reviewed'):
                      published.add(normalized)

          enrichment_path.write_text(json.dumps(enrichment, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          manifest_path.write_text(json.dumps(sorted(published), indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Build directory from live station catalogue
        continue-on-error: true
        run: python3 build_artists.py

      - name: Build standalone artist SEO pages
        run: python3 build_artist_pages.py

      - name: Link existing directory to standalone artist pages
        run: |
          python3 - <<'PY'
          from html import escape
          from pathlib import Path
          from build_artist_pages import load_profiles, load_enrichments, slugify

          directory_path = Path('artists.html')
          html = directory_path.read_text(encoding='utf-8')
          profiles = load_profiles()
          enrichments = load_enrichments()
          linked = 0

          for key in sorted(set(profiles) | set(enrichments)):
              profile_name, profile = profiles.get(key, ('', {}))
              enrichment_name, enrichment = enrichments.get(key, ('', {}))
              if not profile and not enrichment.get('reviewed'):
                  continue
              name = profile_name or enrichment_name
              if not name:
                  continue

              escaped_name = escape(name)
              slug = slugify(name)
              plain = f'<summary>{escaped_name} <span class="artist-meta">'
              linked_summary = (
                  f'<summary><a class="artist-page-link" href="./artists/{slug}.html">'
                  f'{escaped_name}</a> <span class="artist-meta">'
              )
              if plain in html:
                  html = html.replace(plain, linked_summary, 1)
                  linked += 1

          if '.artist-page-link {' not in html:
              style = '''\n    .artist-page-link { color: inherit; text-decoration: underline; text-decoration-color: #C33; text-underline-offset: 3px; }\n    .artist-page-link:hover, .artist-page-link:focus { color: #C33; }\n'''
              html = html.replace('</style>', style + '</style>', 1)

          directory_path.write_text(html, encoding='utf-8')
          print(f'Linked {linked} researched artists in artists.html')
          PY

      - name: Keep enrichment batches as source of truth
        run: git checkout -- artist_enrichment.json artist_publish_manifest.json

      - name: Commit generated artist pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artists.html artists/ sitemap.xml
          if git diff --cached --quiet; then
            echo 'No artist page changes to commit.'
            exit 0
          fi
          git commit -m 'Rebuild artist directory and SEO pages'

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}..."
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo 'Unable to push generated artist pages after 5 attempts.' >&2
          exit 1
