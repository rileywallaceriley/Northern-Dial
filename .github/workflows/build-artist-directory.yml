name: Build artist directory

on:
  push:
    paths:
      - 'artist_enrichment_batches/**'
      - 'artist_profiles.json'
      - 'artist_removals.txt'
      - 'build_artists.py'
      - 'build_artist_pages.py'
      - 'build_listening_paths.py'
      - 'listening_paths.json'
      - 'patch_directory_enrichment.py'
      - 'normalize_artist_back_links.py'
      - 'audit_artist_directory_integrity.py'
      - '.github/workflows/build-artist-directory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-artist-directory
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge reviewed enrichment batches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob
          import json

          enrichment_path = Path('artist_enrichment.json')
          manifest_path = Path('artist_publish_manifest.json')

          enrichment = json.loads(enrichment_path.read_text(encoding='utf-8')) if enrichment_path.exists() else {}
          published = set(json.loads(manifest_path.read_text(encoding='utf-8'))) if manifest_path.exists() else set()

          for filename in sorted(glob.glob('artist_enrichment_batches/*.json')):
              try:
                  batch = json.loads(Path(filename).read_text(encoding='utf-8'))
              except json.JSONDecodeError as exc:
                  raise SystemExit(f'Invalid enrichment JSON in {filename}: {exc}') from exc
              for key, value in batch.items():
                  normalized = str(key).casefold()
                  if isinstance(value, dict):
                      existing = enrichment.get(normalized)
                      if not isinstance(existing, dict):
                          existing = {}
                      existing.update(value)
                      enrichment[normalized] = existing
                      if existing.get('reviewed'):
                          published.add(normalized)
                  else:
                      enrichment[normalized] = value

          enrichment_path.write_text(json.dumps(enrichment, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          manifest_path.write_text(json.dumps(sorted(published), indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Reconcile committed enrichment with current static directory
        run: python3 patch_directory_enrichment.py

      - name: Build directory from live station catalogue
        continue-on-error: true
        timeout-minutes: 3
        run: python3 build_artists.py

      - name: Reconcile directory after live catalogue build
        run: python3 patch_directory_enrichment.py

      - name: Build standalone artist SEO pages
        run: python3 build_artist_pages.py

      - name: Normalize standalone artist return links
        run: python3 normalize_artist_back_links.py

      - name: Build Listening Paths and connect artist profiles
        run: python3 build_listening_paths.py

      - name: Link next 200 researched artists to standalone pages
        run: |
          python3 - <<'PY'
          from html import unescape
          from pathlib import Path
          import re
          from build_artist_pages import load_profiles, load_enrichments, slugify

          BATCH_SIZE = 200
          directory_path = Path('artists.html')
          html = directory_path.read_text(encoding='utf-8')
          profiles = load_profiles()
          enrichments = load_enrichments()

          researched = {}
          for key in sorted(set(profiles) | set(enrichments)):
              profile_name, profile = profiles.get(key, ('', {}))
              enrichment_name, enrichment = enrichments.get(key, ('', {}))
              if not (profile.get('bio') or enrichment.get('bio')):
                  continue
              name = enrichment_name or profile_name or key
              researched[str(key).casefold()] = slugify(name)
              researched[slugify(name)] = slugify(name)

          summary_pattern = re.compile(
              r'<summary>(?P<label>.*?)\s*<span class="artist-meta">',
              re.IGNORECASE | re.DOTALL,
          )
          tag_pattern = re.compile(r'<[^>]+>')
          stats = {'added': 0, 'existing': 0, 'matched': 0}

          def replace_summary(match):
              label_html = match.group('label').strip()
              display_text = unescape(tag_pattern.sub('', label_html)).strip()
              slug = researched.get(display_text.casefold()) or researched.get(slugify(display_text))
              if not slug:
                  return match.group(0)

              stats['matched'] += 1
              if 'artist-page-link' in label_html:
                  stats['existing'] += 1
                  return match.group(0)
              if stats['added'] >= BATCH_SIZE:
                  return match.group(0)

              stats['added'] += 1
              return (
                  f'<summary><a class="artist-page-link" href="./artists/{slug}.html" '
                  f'onclick="event.stopPropagation()">{label_html}</a> '
                  f'<span class="artist-meta">'
              )

          html = summary_pattern.sub(replace_summary, html)

          if '.artist-page-link {' not in html:
              style = '''\n    .artist-page-link { color: inherit; text-decoration: underline; text-decoration-color: #C33; text-underline-offset: 3px; }\n    .artist-page-link:hover, .artist-page-link:focus { color: #C33; }\n'''
              html = html.replace('</style>', style + '</style>', 1)

          directory_path.write_text(html, encoding='utf-8')
          remaining = max(0, stats['matched'] - stats['existing'] - stats['added'])
          print(
              f"Added {stats['added']} new artist links; "
              f"preserved {stats['existing']} existing links; "
              f"matched {stats['matched']} researched directory artists; "
              f"approximately {remaining} matched artists remain unlinked."
          )
          PY

      - name: Final directory integrity reconciliation
        run: python3 patch_directory_enrichment.py

      - name: Normalize return links after final reconciliation
        run: python3 normalize_artist_back_links.py

      - name: Enforce complete directory/profile integrity
        run: python3 audit_artist_directory_integrity.py

      - name: Keep enrichment batches as source of truth
        run: git checkout -- artist_enrichment.json artist_publish_manifest.json

      - name: Commit generated artist pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artists.html artists/ listening-paths.html listening-paths/ sitemap.xml artist_directory_integrity_audit.json
          if git diff --cached --quiet; then
            echo 'No artist page or Listening Path changes to commit.'
            exit 0
          fi
          git commit -m 'Rebuild artist directory, SEO pages and Listening Paths'

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}..."
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo 'Unable to push generated artist pages after 5 attempts.' >&2
          exit 1

