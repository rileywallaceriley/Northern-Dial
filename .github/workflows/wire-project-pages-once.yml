name: Fix blog project navigation one-time update

on:
  push:
    paths:
      - '.github/workflows/wire-project-pages-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix About and Submit list items in blog navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          pattern = re.compile(
              r'<li><a href="/about\.html">About</a>\s*'
              r'<a href="([^"]*#submit)" class="submit-link">Submit</a></li>',
              re.I,
          )

          for path in sorted(Path('blog').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              fixed, count = pattern.subn(
                  r'<li><a href="/about.html">About</a></li>\n      <li><a href="\1" class="submit-link">Submit</a></li>',
                  text,
                  count=1,
              )
              if count:
                  path.write_text(fixed, encoding='utf-8')
                  changed.append(str(path))

          print(f'Fixed {len(changed)} blog navigation files:')
          for item in changed:
              print(' -', item)
          PY

      - name: Commit corrected blog navigation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/*.html
          if git diff --cached --quiet; then
            echo 'No blog navigation corrections required.'
            exit 0
          fi
          git commit -m 'Fix blog About and Submit navigation markup'
          git push origin HEAD:main
