name: Site quality and accessibility audit

on:
  workflow_dispatch:
  schedule:
    - cron: '20 13 * * 1'
  push:
    paths:
      - '*.html'
      - '*.js'
      - 'blog/*.html'
      - 'fr/*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/site_quality_audit.py'
      - '.github/workflows/accessibility-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run SEO, accessibility and architecture guardrails
        run: python3 scripts/site_quality_audit.py
