name: Accessibility guardrail audit

on:
  workflow_dispatch:
  schedule:
    - cron: '20 13 * * 1'
  push:
    paths:
      - '*.html'
      - 'blog/*.html'
      - 'fr/*.html'
      - 'scripts/accessibility_audit.py'
      - '.github/workflows/accessibility-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run accessibility and navigation guardrails
        run: python3 scripts/accessibility_audit.py
