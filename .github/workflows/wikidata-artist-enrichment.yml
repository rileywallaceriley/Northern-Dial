name: Wikidata artist enrichment

on:
  push:
    paths:
      - 'wikidata_profile_enricher.py'
      - '.github/workflows/wikidata-artist-enrichment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Wikidata entity response handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('wikidata_profile_enricher.py')
          text = path.read_text(encoding='utf-8')
          old = '        for entity in data.get("entities") or []:\n            if entity.get("id"):\n                result[entity["id"]] = entity\n'
          new = '        entities = data.get("entities") or {}\n        iterator = entities.values() if isinstance(entities, dict) else entities\n        for entity in iterator:\n            if entity.get("id"):\n                result[entity["id"]] = entity\n'
          if old in text:
              text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Enrich all remaining exact Wikidata music matches
        run: python3 wikidata_profile_enricher.py --workers 10

      - name: Commit Wikidata enrichment batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add artist_enrichment_batches artist_enrichment_wikidata_state.json
          if git diff --cached --quiet; then
            echo 'No Wikidata enrichment changes to commit.'
            exit 0
          fi
          git commit -m 'Add Wikidata artist enrichment batch'
          git push
