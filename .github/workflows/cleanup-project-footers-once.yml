name: Clean duplicate project-page footers one-time update

on:
  push:
    paths:
      - '.github/workflows/cleanup-project-footers-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate universal strip from project pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'\n?<!-- ND_PROJECT_LINKS_START -->.*?<!-- ND_PROJECT_LINKS_END -->\n?',
              re.S,
          )
          changed = []
          for name in ['about.html', 'sessions.html', 'archive.html', 'accessibility.html']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text2, count = pattern.subn('\n', text, count=1)
              if count:
                  path.write_text(text2, encoding='utf-8')
                  changed.append(name)
          print('Cleaned:', ', '.join(changed))
          PY

      - name: Commit footer cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add about.html sessions.html archive.html accessibility.html
          if git diff --cached --quiet; then
            echo 'No duplicate footers found.'
            exit 0
          fi
          git commit -m 'Remove duplicate project-page footers'
          git push origin HEAD:main
