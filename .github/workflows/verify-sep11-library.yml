name: Verify Sept 11 request API
on:
  push:
    paths:
      - '.github/workflows/verify-sep11-library.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Query Northern Dial request API
        shell: python
        run: |
          import json, urllib.parse, urllib.request
          from pathlib import Path
          endpoint='https://a10.asurahosting.com/api/station/northern_dial/requests'
          artists=['Mattmac','CG Tears','Jon McKiel','Starpainter','Hip Club Groove','LOONY','NorthSideBenji','AR Paisley','FRVRFRIDAY','TOBi']
          out={'endpoint':endpoint,'checked':'2026-09-11','artists':{}}
          for artist in artists:
              url=endpoint+'?'+urllib.parse.urlencode({'searchPhrase':artist,'rowCount':100,'current':1})
              try:
                  with urllib.request.urlopen(url,timeout=20) as r:
                      raw=r.read().decode('utf-8','replace')
                  try: payload=json.loads(raw)
                  except Exception: payload=raw
                  blob=json.dumps(payload,ensure_ascii=False) if not isinstance(payload,str) else payload
                  out['artists'][artist]={'ok':True,'matched':artist.casefold() in blob.casefold(),'result':payload}
              except Exception as e:
                  out['artists'][artist]={'ok':False,'matched':False,'error':str(e)}
          Path('data').mkdir(exist_ok=True)
          Path('data/request-api-verification-20260911.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8')
      - name: Commit verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/request-api-verification-20260911.json
          git commit -m "Verify Sept 11 artists in request API" || exit 0
          git push
