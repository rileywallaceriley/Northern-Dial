name: Unify site header and navigation

on:
  push:
    paths:
      - 'nd-shell.css'
      - 'nd-shell.js'
      - '.github/workflows/unify-site-shell.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unify-site-shell
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add shared shell assets to public pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_tag = '  <link rel="stylesheet" href="/nd-shell.css?v=20260907b">'
          js_tag = '  <script src="/nd-shell.js?v=20260907b" defer></script>'
          skip_names = {'admin.html'}
          skip_parts = {'.git', '.github', 'archives'}
          changed = []

          for path in Path('.').rglob('*.html'):
              if path.name in skip_names or any(part in skip_parts for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              if '/nd-shell.css' not in text and '</head>' in text:
                  text = text.replace('</head>', css_tag + '\n</head>', 1)
              if '/nd-shell.js' not in text and '</body>' in text:
                  text = text.replace('</body>', js_tag + '\n</body>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} public HTML files')
          for item in changed:
              print(item)
          PY

      - name: Commit shared shell includes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo 'No site shell changes to commit.'
            exit 0
          fi
          git commit -m 'Use shared site header and navigation'
          git push origin HEAD:main
