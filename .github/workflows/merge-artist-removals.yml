name: Merge artist removals

on:
  push:
    paths:
      - 'artist_removal_batches/**'
      - '.github/workflows/merge-artist-removals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    concurrency:
      group: artist-removal-merge
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge removal batches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob
          import json

          target = Path('artist_removals.txt')
          lines = target.read_text(encoding='utf-8').splitlines() if target.exists() else []
          header = [line for line in lines if line.lstrip().startswith('#')]
          names = [line.strip() for line in lines if line.strip() and not line.lstrip().startswith('#')]
          seen = {name.casefold() for name in names}

          def add_name(name):
              name = str(name).strip()
              if not name or name.casefold() in seen:
                  return
              names.append(name)
              seen.add(name.casefold())

          for filename in sorted(glob.glob('artist_removal_batches/*.txt')):
              for line in Path(filename).read_text(encoding='utf-8').splitlines():
                  name = line.strip()
                  if not name or name.startswith('#'):
                      continue
                  add_name(name)

          # Cleanup batches 43+ use JSON so each removal can retain its
          # verification reason, country and source URLs. The artist names are
          # the top-level keys and must also be merged into the active list.
          for filename in sorted(glob.glob('artist_removal_batches/*.json')):
              data = json.loads(Path(filename).read_text(encoding='utf-8'))
              if isinstance(data, dict):
                  for name in data:
                      add_name(name)

          target.write_text('\n'.join(header + names) + '\n', encoding='utf-8')
          print(f'Merged {len(names)} removal names.')
          PY

      - name: Commit merged removal list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artist_removals.txt
          if git diff --cached --quiet; then
            echo 'No removal changes to commit.'
            exit 0
          fi
          git commit -m 'Merge verified non-Canadian artist removals'
          git pull --rebase origin main
          git push
