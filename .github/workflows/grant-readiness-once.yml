name: Grant readiness one-time update

on:
  push:
    paths:
      - '.github/workflows/grant-readiness-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add public impact and curation sections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          impact_css = r'''
          /* ND_GRANT_IMPACT_START */
          .grant-impact {
              background: #fff;
              border: 4px solid #1a1a1a;
              border-radius: 12px;
              margin: 0 0 38px;
              padding: 26px;
          }
          .grant-impact-head {
              align-items: end;
              display: flex;
              gap: 24px;
              justify-content: space-between;
              margin-bottom: 18px;
          }
          .grant-impact-kicker {
              color: #C33;
              font-family: 'Oswald', sans-serif;
              font-size: .78rem;
              font-weight: 700;
              letter-spacing: .16em;
              margin-bottom: 4px;
              text-transform: uppercase;
          }
          .grant-impact h2 {
              color: #1a1a1a;
              font-family: 'Bebas Neue', sans-serif;
              font-size: 2.35rem;
              font-weight: 400;
              letter-spacing: .05em;
              line-height: 1;
              margin: 0;
              text-transform: uppercase;
          }
          .grant-impact-link {
              color: #8B2323;
              flex: 0 0 auto;
              font-family: 'Oswald', sans-serif;
              font-size: .82rem;
              font-weight: 700;
              letter-spacing: .08em;
              text-decoration: none;
              text-transform: uppercase;
          }
          .grant-impact-link:hover,
          .grant-impact-link:focus { text-decoration: underline; }
          .grant-impact-grid {
              display: grid;
              gap: 12px;
              grid-template-columns: repeat(4, minmax(0, 1fr));
          }
          .grant-impact-stat {
              background: #1a1a1a;
              border-bottom: 4px solid #C33;
              border-radius: 8px;
              color: #fff;
              padding: 17px 14px;
              text-align: center;
          }
          .grant-impact-number {
              display: block;
              font-family: 'Bebas Neue', sans-serif;
              font-size: 2.3rem;
              font-weight: 400;
              line-height: 1;
          }
          .grant-impact-label {
              color: #ddd;
              display: block;
              font-size: .78rem;
              line-height: 1.35;
              margin-top: 5px;
          }
          .grant-impact-note {
              color: #666;
              font-size: .82rem;
              line-height: 1.45;
              margin: 12px 0 0;
          }
          @media (max-width: 760px) {
              .grant-impact-head { align-items: flex-start; flex-direction: column; gap: 9px; }
              .grant-impact-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
          }
          @media (max-width: 430px) {
              .grant-impact { padding: 20px 16px; }
              .grant-impact-grid { grid-template-columns: 1fr; }
          }
          /* ND_GRANT_IMPACT_END */
          '''

          impact_html = r'''
          <!-- ND_GRANT_IMPACT_HTML_START -->
          <section class="grant-impact" aria-labelledby="grant-impact-title">
              <div class="grant-impact-head">
                  <div>
                      <div class="grant-impact-kicker">Current Project Snapshot</div>
                      <h2 id="grant-impact-title">Northern Dial at a Glance</h2>
                  </div>
                  <a class="grant-impact-link" href="about.html">About the project →</a>
              </div>
              <div class="grant-impact-grid">
                  <div class="grant-impact-stat"><span class="grant-impact-number" id="impactRetained">1,299</span><span class="grant-impact-label">artists currently retained after editorial removals</span></div>
                  <div class="grant-impact-stat"><span class="grant-impact-number" id="impactProfiles">944</span><span class="grant-impact-label">retained artists with completed profiles</span></div>
                  <div class="grant-impact-stat"><span class="grant-impact-number" id="impactRemoved">696</span><span class="grant-impact-label">non-Canadian or misclassified credits removed</span></div>
                  <div class="grant-impact-stat"><span class="grant-impact-number" id="impactCoverage">72.7%</span><span class="grant-impact-label">current profile completion across retained artists</span></div>
              </div>
              <p class="grant-impact-note">The artist library is actively researched and reviewed. Ambiguous credits stay unresolved rather than becoming guesses.</p>
          </section>
          <script>
          fetch('./artist_enrichment_audit.json', {cache:'no-store'})
            .then(response => response.ok ? response.json() : Promise.reject())
            .then(data => {
              const set = (id, value) => { const el = document.getElementById(id); if (el && value !== undefined && value !== null) el.textContent = value; };
              set('impactRetained', Number(data.retained_artists).toLocaleString());
              set('impactProfiles', Number(data.retained_with_profiles).toLocaleString());
              set('impactRemoved', Number(data.removed_non_canadian).toLocaleString());
              set('impactCoverage', `${data.completion_percent}%`);
            })
            .catch(() => {});
          </script>
          <!-- ND_GRANT_IMPACT_HTML_END -->
          '''

          if 'ND_GRANT_IMPACT_START' not in text:
              if '</style>' not in text:
                  raise SystemExit('No style end in index.html')
              text = text.replace('</style>', impact_css + '\n</style>', 1)
          if 'ND_GRANT_IMPACT_HTML_START' not in text:
              marker = '<!-- Explore Recent Songs Banner -->'
              if marker not in text:
                  raise SystemExit('Explore banner marker not found')
              text = text.replace(marker, impact_html + '\n\n' + marker, 1)
          index.write_text(text, encoding='utf-8')

          artists = Path('artists.html')
          text = artists.read_text(encoding='utf-8')
          curation_css = r'''
          /* ND_ARTIST_CURATION_START */
          .curation-panel {
              background: #fff;
              border: 4px solid #1a1a1a;
              border-radius: 12px;
              margin: 0 0 28px;
              padding: 25px;
          }
          .curation-panel .curation-kicker {
              color: #C33;
              font-family: 'Oswald', sans-serif;
              font-size: .78rem;
              font-weight: 700;
              letter-spacing: .15em;
              margin-bottom: 5px;
              text-transform: uppercase;
          }
          .curation-panel h2 {
              color: #1a1a1a;
              font-family: 'Bebas Neue', sans-serif;
              font-size: 2.35rem;
              font-weight: 400;
              letter-spacing: .04em;
              margin: 0 0 10px;
              text-transform: uppercase;
          }
          .curation-panel p { color: #555; line-height: 1.6; margin: 0 0 12px; }
          .curation-points {
              display: grid;
              gap: 10px;
              grid-template-columns: repeat(4, minmax(0, 1fr));
              margin-top: 18px;
          }
          .curation-point { background: #f7eded; border-top: 4px solid #C33; padding: 13px; }
          .curation-point strong { display: block; font-family: 'Oswald', sans-serif; font-size: .82rem; letter-spacing: .05em; margin-bottom: 4px; text-transform: uppercase; }
          .curation-point span { color: #555; font-size: .82rem; line-height: 1.4; }
          .curation-links { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 17px; }
          .curation-links a { border: 2px solid #1a1a1a; border-radius: 6px; font-family: 'Oswald', sans-serif; font-size: .78rem; font-weight: 700; letter-spacing: .07em; padding: 8px 10px; text-decoration: none; text-transform: uppercase; }
          .curation-links a:first-child { background: #C33; border-color: #C33; color: #fff; }
          @media (max-width: 760px) { .curation-points { grid-template-columns: 1fr 1fr; } }
          @media (max-width: 460px) { .curation-points { grid-template-columns: 1fr; } .curation-panel { padding: 20px 16px; } }
          /* ND_ARTIST_CURATION_END */
          '''
          curation_html = r'''
          <!-- ND_ARTIST_CURATION_HTML_START -->
          <section class="curation-panel" aria-labelledby="curation-title">
              <div class="curation-kicker">About the Catalogue</div>
              <h2 id="curation-title">How We Curate Northern Dial</h2>
              <p>The artist library is a living editorial resource, not an automated scrape. Northern Dial reviews artist identities, removes clearly non-Canadian or non-artist credits, enriches profiles with reliable sources and keeps ambiguous cases unresolved until the evidence is strong enough.</p>
              <div class="curation-points">
                  <div class="curation-point"><strong>Review</strong><span>Artist credits are checked rather than accepted blindly from source metadata.</span></div>
                  <div class="curation-point"><strong>Verify</strong><span>Profiles use reliable sources, official links and location information where available.</span></div>
                  <div class="curation-point"><strong>Remove</strong><span>Clearly non-Canadian artists and non-artist credits are excluded from the public artist index.</span></div>
                  <div class="curation-point"><strong>Resolve Carefully</strong><span>Uncertain cases stay unresolved instead of being turned into confident guesses.</span></div>
              </div>
              <div class="curation-links"><a href="about.html#curation">Read About the Project</a><a href="archive.html">Archive and Atlas Roadmap</a></div>
          </section>
          <!-- ND_ARTIST_CURATION_HTML_END -->
          '''
          if 'ND_ARTIST_CURATION_START' not in text:
              if '</style>' not in text:
                  raise SystemExit('No style end in artists.html')
              text = text.replace('</style>', curation_css + '\n</style>', 1)
          if 'ND_ARTIST_CURATION_HTML_START' not in text:
              marker = '<!-- STATIC_ARTIST_LETTER_NAV_START -->'
              if marker not in text:
                  raise SystemExit('Artist nav marker not found')
              text = text.replace(marker, curation_html + '\n' + marker, 1)
          artists.write_text(text, encoding='utf-8')
          PY

      - name: Commit public project context
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html artists.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add impact and curation context for Northern Dial'
          git push origin HEAD:main
