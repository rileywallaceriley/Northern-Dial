<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse recently played Canadian songs on Northern Dial and search our catalogue.">
    <meta name="theme-color" content="#CC3333">
    <link rel="canonical" href="https://www.northerndial.ca/library.html">
    <meta property="og:title" content="Browse Canadian Songs | Northern Dial">
    <meta property="og:description" content="Browse recently played Canadian songs and search the Northern Dial catalogue.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.northerndial.ca/library.html">
    <title>Browse Canadian Songs | Northern Dial</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

    html {
        background: #ffffff;
        overscroll-behavior-y: none;
    }

    body {
        font-family: 'Roboto Condensed', sans-serif;
        color: #1a1a1a;
        background: #ffffff;
        transition: background-color 120ms linear;
        overscroll-behavior-y: none;
        transition: background 0.3s ease;
    }

    .header {
        position: relative;
        z-index: 1;
        background: white;
        backdrop-filter: blur(10px);
        border-bottom: 4px solid #C33;
        padding: 15px 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .header-content {
        max-width: 1400px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
    }

    .logo-link {
        display: flex;
        align-items: center;
        text-decoration: none;
        color: #C33;
        font-family: 'Bebas Neue', sans-serif;
        font-size: 1.5rem;
        letter-spacing: 3px;
        transition: transform 0.3s ease;
        white-space: nowrap;
    }

    .logo-link:hover {
        transform: scale(1.05);
    }

    .back-arrow {
        font-size: 2rem;
        margin-right: 10px;
        color: #C33;
    }

    .search-container {
        flex: 1;
        min-width: 200px;
        max-width: 500px;
        position: relative;
    }

    .search-input {
        width: 100%;
        padding: 15px 20px;
        font-size: 1.1rem;
        font-family: 'Roboto Condensed', sans-serif;
        border: 3px solid #C33;
        border-radius: 8px;
        background: white;
        color: #1a1a1a;
        outline: none;
        transition: all 0.3s ease;
    }

    .search-input:focus {
        background: #f9f9f9;
        box-shadow: 0 0 20px rgba(195, 51, 51, 0.3);
    }

    .catalog-info {
        color: #666;
        font-size: 0.9rem;
        text-align: right;
    }

    .page-nav {
        background: #1a1a1a;
        border-bottom: 2px solid #C33;
        display: flex;
        justify-content: center;
        margin: 15px -20px -15px;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .page-nav a {
        color: #fff;
        display: block;
        font-family: 'Oswald', sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        padding: 14px 28px;
        text-decoration: none;
        text-transform: uppercase;
        transition: color 0.2s ease, background-color 0.2s ease;
    }

    .page-nav a:hover,
    .page-nav a:focus,
    .page-nav a.active {
        background: #262626;
        color: #C33;
    }

    .page-nav a.active {
        border-bottom: 3px solid #C33;
    }

    .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 40px 20px;
    }

    .loading {
        text-align: center;
        padding: 100px 20px;
        font-size: 1.5rem;
        color: #C33;
    }

    .catalog-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 30px;
        margin-top: 20px;
    }

    @media (min-width: 640px) {
        .catalog-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (min-width: 1024px) {
        .catalog-grid {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    @media (min-width: 1400px) {
        .catalog-grid {
            grid-template-columns: repeat(4, 1fr);
        }
    }

    .album-card {
        background: white;
        border: 4px solid #1a1a1a;
        border-radius: 12px;
        padding: 20px;
        transition: all 0.4s ease;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .album-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 40px rgba(0,0,0,0.25);
        border-color: #C33;
    }

    .album-art {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 8px;
        object-fit: cover;
        margin-bottom: 15px;
        background: #e0e0e0;
        border: 2px solid #ddd;
    }

    .album-art-placeholder {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 8px;
        background: linear-gradient(135deg, #e0e0e0, #f5f5f5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
        color: #999;
        margin-bottom: 15px;
        border: 2px solid #ddd;
    }

    .album-title {
        font-family: 'Oswald', sans-serif;
        font-size: 1.3rem;
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 8px;
        line-height: 1.3;
    }

    .album-artist {
        font-size: 1rem;
        color: #666;
        margin-bottom: 15px;
    }

    .request-btn {
        width: 100%;
        background: linear-gradient(135deg, #C33, #8B2323);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: 'Roboto Condensed', sans-serif;
    }

    .request-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(195, 51, 51, 0.4);
    }

    .request-btn:active {
        transform: scale(0.98);
    }

    .request-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
    }

    .empty-state {
        text-align: center;
        padding: 100px 20px;
    }

    .empty-state-icon {
        font-size: 5rem;
        margin-bottom: 20px;
        opacity: 0.3;
    }

    .empty-state-text {
        font-size: 1.5rem;
        color: #666;
        font-family: 'Oswald', sans-serif;
    }

    .status-message {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: rgba(0, 180, 0, 0.95);
        color: white;
        padding: 20px 30px;
        border-radius: 12px;
        font-weight: 700;
        box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        z-index: 1000;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.4s ease;
    }

    .status-message.show {
        opacity: 1;
        transform: translateY(0);
    }

    .status-message.error {
        background: rgba(195, 51, 51, 0.95);
    }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .searching-spinner {
        display: inline-block;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: 
            radial-gradient(circle at center, #1a1a1a 0%, #1a1a1a 20%, transparent 20%, transparent 22%, #1a1a1a 22%, #1a1a1a 40%, transparent 40%),
            conic-gradient(from 0deg, #1a1a1a 0deg, #1a1a1a 30deg, transparent 30deg, transparent 60deg, #1a1a1a 60deg, #1a1a1a 90deg, transparent 90deg, transparent 120deg, #1a1a1a 120deg, #1a1a1a 150deg, transparent 150deg, transparent 180deg, #1a1a1a 180deg, #1a1a1a 210deg, transparent 210deg, transparent 240deg, #1a1a1a 240deg, #1a1a1a 270deg, transparent 270deg, transparent 300deg, #1a1a1a 300deg, #1a1a1a 330deg, transparent 330deg, transparent 360deg);
        border: 3px solid #C33;
        animation: spin 1s linear infinite;
        position: relative;
    }

    .searching-spinner::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 12px;
        height: 12px;
        background: #C33;
        border-radius: 50%;
    }

    .full-library-button {
        display: inline-block;
        background: #C33;
        color: #fff;
        border: 2px solid #C33;
        border-radius: 6px;
        padding: 12px 22px;
        font-family: 'Oswald', sans-serif;
        font-size: 1rem;
        letter-spacing: 1px;
        text-decoration: none;
        text-transform: uppercase;
        white-space: nowrap;
        margin-top: 12px;
        transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .full-library-button:hover,
    .full-library-button:focus {
        background: #8B2323;
        border-color: #8B2323;
        color: #fff;
        transform: translateY(-2px);
    }

    .full-library-button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
        .full-library-button {
            transition: none;
        }
    }

    @media (max-width: 639px) {
        .header {
            padding: 15px;
        }

        .header-content {
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .logo-link {
            justify-content: center;
            width: 100%;
        }

        .logo-link img {
            height: 60px !important;
            margin: 0 10px !important;
        }

        .back-arrow {
            font-size: 1.5rem !important;
        }

        .search-container {
            width: 100%;
            order: 2;
        }

        .catalog-info {
            text-align: center;
            width: 100%;
            order: 3;
        }

        .page-nav {
            margin-left: -15px;
            margin-right: -15px;
            width: calc(100% + 30px);
        }

        .page-nav a {
            flex: 1 1 25%;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            padding: 12px 6px;
            text-align: center;
        }

        .full-library-button {
            font-size: 0.92rem;
            padding-left: 12px;
            padding-right: 12px;
        }

        .status-message {
            left: 20px;
            right: 20px;
            bottom: 20px;
        }

        .container > div:first-child {
            padding: 20px 15px !important;
        }

        .container > div:first-child h1 {
            font-size: 1.8rem !important;
            letter-spacing: 2px !important;
        }

        .container > div:first-child p {
            font-size: 0.85rem !important;
        }

        .container {
            padding: 20px 15px;
        }
    }


/* ND_MOBILE_MENU_CSS_START */
.mobile-menu-toggle {
    display: none;
}

.mobile-menu-links {
    align-items: stretch;
    display: flex;
    gap: inherit;
    justify-content: center;
    width: 100%;
}

.mobile-menu-links > li {
    list-style: none;
}

@media (max-width: 768px) {
    .mobile-menu-nav {
        display: block !important;
        padding: 0 !important;
        position: sticky !important;
        top: 0 !important;
        z-index: 1000 !important;
    }

    .mobile-menu-toggle {
        align-items: center;
        background: #1a1a1a !important;
        border: 0 !important;
        border-radius: 0 !important;
        color: #ffffff !important;
        cursor: pointer;
        display: flex !important;
        font-family: 'Oswald', sans-serif !important;
        font-size: 0.88rem !important;
        font-weight: 700 !important;
        justify-content: space-between;
        letter-spacing: 0.14em !important;
        line-height: 1 !important;
        margin: 0 !important;
        min-height: 48px;
        padding: 13px 18px !important;
        text-transform: uppercase;
        width: 100% !important;
    }

    .mobile-menu-toggle:hover,
    .mobile-menu-toggle:focus {
        background: #262626 !important;
        color: #ffffff !important;
    }

    .mobile-menu-toggle:focus-visible {
        outline: 3px solid #CC3333 !important;
        outline-offset: -3px;
    }

    .mobile-menu-icon {
        color: #CC3333;
        font-family: Arial, sans-serif;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1;
    }

    .mobile-menu-links {
        background: #1a1a1a;
        display: none !important;
        flex-direction: column !important;
        gap: 0 !important;
        margin: 0 !important;
        max-width: none !important;
        padding: 0 !important;
        width: 100% !important;
    }

    .mobile-menu-nav.menu-open .mobile-menu-links {
        display: flex !important;
    }

    .mobile-menu-links > li {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
    }

    .mobile-menu-links a,
    .mobile-menu-links li a {
        background: #1a1a1a !important;
        border: 0 !important;
        border-bottom: 1px solid #343434 !important;
        border-radius: 0 !important;
        color: #ffffff !important;
        display: block !important;
        flex: none !important;
        font-family: 'Oswald', sans-serif !important;
        font-size: 0.88rem !important;
        font-weight: 700 !important;
        letter-spacing: 0.11em !important;
        margin: 0 !important;
        padding: 14px 18px !important;
        text-align: left !important;
        text-decoration: none !important;
        text-transform: uppercase !important;
        width: 100% !important;
    }

    .mobile-menu-links a:hover,
    .mobile-menu-links a:focus,
    .mobile-menu-links a.active,
    .mobile-menu-links li a:hover,
    .mobile-menu-links li a:focus,
    .mobile-menu-links li a.active {
        background: #262626 !important;
        color: #CC3333 !important;
    }

    .mobile-menu-links a.active,
    .mobile-menu-links li a.active {
        border-left: 4px solid #CC3333 !important;
        padding-left: 14px !important;
    }

    .mobile-menu-links .submit-link,
    .mobile-menu-links li .submit-link {
        background: #CC3333 !important;
        border-bottom-color: #CC3333 !important;
        color: #ffffff !important;
    }

    .mobile-menu-links .submit-link:hover,
    .mobile-menu-links .submit-link:focus,
    .mobile-menu-links li .submit-link:hover,
    .mobile-menu-links li .submit-link:focus {
        background: #8B2323 !important;
        color: #ffffff !important;
    }
}
/* ND_MOBILE_MENU_CSS_END */


    .songs-search-top {
        margin: 0 auto 28px;
        max-width: 760px;
        text-align: center;
    }
    .songs-search-top .search-container {
        max-width: none;
        width: 100%;
    }
    .songs-search-top .catalog-info {
        margin-top: 12px;
        text-align: center;
    }

</style>

<body>
<div class="container">
    <section class="songs-search-top" aria-label="Search Northern Dial songs">
        <div class="search-container">
            <input type="text"
                   class="search-input"
                   id="searchInput"
                   placeholder="Search catalog..."
                   autocomplete="off">
        </div>
        <div class="catalog-info">
            <div id="catalogCount">Loading...</div>
        </div>
    </section>

    <div style="background: linear-gradient(135deg, #1a1a1a, #2a2a2a); border: 4px solid #C33; border-radius: 12px; padding: 25px; margin-bottom: 30px; text-align: center;">
        <h1 style="font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; color: #C33; margin-bottom: 10px; letter-spacing: 4px;">RECENTLY PLAYED</h1>
        <p style="color: rgba(255,255,255,0.9); font-size: 1rem; margin-bottom: 8px;">Browse recent tracks or search to explore our catalog</p>
        <p style="color: rgba(255,255,255,0.7); font-size: 0.85rem; font-style: italic;">Note: Search dynamically queries our full requestable library</p>
        <a class="full-library-button" href="artists.html">Browse the Full Artist Library →</a>
    </div>

    <div class="loading" id="loadingState">
        <div class="searching-spinner" style="margin: 0 auto 20px;"></div>
        <div>Loading recently played tracks...</div>
    </div>
    <div class="catalog-grid" id="catalogGrid" style="display:none;"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-state-icon">🔍</div>
        <div class="empty-state-text">No tracks found</div>
    </div>
</div>

<div class="status-message" id="statusMessage"></div>

<script src="/library.js?v=20260927a"></script>
